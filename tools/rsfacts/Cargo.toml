[package]
name = "rsfacts"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "3", default-features = false, features = ["full", "visit", "parsing", "printing"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = "1"
serde_json = "1"

[profile.release]
lto = "thin"
