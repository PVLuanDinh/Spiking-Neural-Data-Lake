name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The torch-free matrix job was DELETED 2026-07-29. It installed numpy only and ran with
  # NORD_TORCH=0 to exercise a "torch-free runtime path" -- the last CI expression of the
  # zero-dependency rule, which pyproject has declared removed project-wide since 2026-07-20.
  # torch and numpy are unconditional core dependencies; a CI job that asserts the brain still
  # works without one of its hard dependencies was testing a contract the project no longer has.
  # The cross-platform / multi-version matrix it carried was real coverage, so it moved HERE
  # rather than being lost with it.
  self-checks:
    name: self-checks ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false                       # one cell failing must not mask the others
      matrix:
        os: [ubuntu-latest, windows-latest]  # the product is Windows-first (record_and_run.ps1, COMx)
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .    # torch + numpy are DEFAULT deps -> the full tier runs
      - name: Run every self-check with the full dependency set
        run: python run_selfchecks.py       # canonical module list lives in run_selfchecks.py

  lint:
    name: lint (ruff) + repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests tools   # whole tree is ruff-formatted (2026-07-20 project-wide format)
      # A tracked file may not present an UNTRACKED .py as a runnable reproduction path -- asserting
      # since 2026-07-30, after the 21 findings of the counted run were cleared. It lives HERE rather
      # than in run_selfchecks.py deliberately: run_selfchecks only executes `python -m
      # snn_data_lake.<mod>` package modules, so moving it into the package to be picked up there would
      # change the canonical 277 self-check count that README.md, docs/RUNNING.md, CONTRIBUTING.md,
      # docs/POLICIES.md and docs/AIRLLM_ANALYSIS.md all quote -- churn in five documents to gate a
      # repo-hygiene check that is not a brain-faculty self-check. It needs the git index, which
      # actions/checkout provides; `git ls-files` reads the index, so the default shallow fetch is fine.
      - name: Citations resolve (no tracked file cites an untracked .py as runnable)
        run: python tools/citation_guard.py

  test:
    name: tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest   # addopts in pyproject run --cov with a >=70% gate
