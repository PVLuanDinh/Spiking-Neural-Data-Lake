name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The torch-free matrix job was DELETED 2026-07-29. It installed numpy only and ran with
  # NORD_TORCH=0 to exercise a "torch-free runtime path" -- the last CI expression of the
  # zero-dependency rule, which pyproject has declared removed project-wide since 2026-07-20.
  # torch and numpy are unconditional core dependencies; a CI job that asserts the brain still
  # works without one of its hard dependencies was testing a contract the project no longer has.
  # The cross-platform / multi-version matrix it carried was real coverage, so it moved HERE
  # rather than being lost with it.
  self-checks:
    name: self-checks ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # CI SIMULATES, IT NEVER RENDERS. mujoco reads MUJOCO_GL at import and raises on an
    # unrecognised value, so the posture is DECLARED here rather than inferred from the absence
    # of a display. `disable` short-circuits the GL block at import and exercises the
    # viewer-unavailable path on every matrix cell for free.
    env:
      MUJOCO_GL: disable
    strategy:
      fail-fast: false                       # one cell failing must not mask the others
      matrix:
        os: [ubuntu-latest, windows-latest]  # the product is Windows-first (record_and_run.ps1, COMx)
        # COLLAPSED TO A SINGLE FREE-THREADED CELL 2026-08-05 (owner decision). The 3.11 leg went
        # first with the >=3.12 floor; 3.12 and 3.13 went with the >=3.14 floor the same day. A cell
        # on an interpreter the package's own metadata excludes cannot run at all -- pip refuses at
        # INSTALL time, not import time. Measured against a wheel differing only in that field:
        # `Requires-Python: >=3.12` -> "ERROR: ... requires a different Python: 3.11.15 not in
        # '>=3.12'", exit 1; the `>=3.11` control installed, exit 0.
        #
        # AND THE VERSION IS NOT THE REQUIREMENT. The brain requires the FREE-THREADED build (PEP
        # 703, ABI tag cp314t): src/snn_data_lake/__init__.py::_require_free_threaded raises on a
        # GIL-enabled interpreter. `actions/setup-python` serves the GIL build for "3.14", so this
        # matrix names "3.14t" -- the free-threaded variant -- and NOT "3.14". Using "3.14" here
        # would fail every job at import, which is the guard working, but it would look like a
        # broken CI rather than a wrong pin.
        python-version: ["3.14t"]
    steps:
      # Full history: run_selfchecks runs gates/null_scale_gate.py bare and dormancy_gate's scale-retest check, which read
      # git history to expire a PENDING re-test; a shallow clone reds "history unavailable" (panel #4519 M4 / #4520 M1).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # PROVE THE INTERPRETER BEFORE TRUSTING THE RUN. If setup-python ever serves a GIL build for
      # "3.14t", every self-check below would still pass -- single-threaded, with the parallelism
      # silently absent. That is the failure this project would not otherwise notice, so it is
      # asserted here rather than assumed. Red: swap "3.14t" for "3.14" above and this step exits 1.
      # R0.4 (plan section 9): the pinned Rust toolchain from rust-toolchain.toml. Every Rust-aware
      # gate (rust_facts self-check, native_dormancy, import_manifest, eprop/gradient_claim,
      # dependency_ledger) builds tools/rsfacts even with native/ ABSENT, so the compiler must be the
      # pinned one on every job that runs them, not whatever the runner image ships (1.99 today).
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Assert the interpreter is free-threaded (cp314t)
        run: |
          python -c "import sys,sysconfig; ft=sysconfig.get_config_var('Py_GIL_DISABLED'); print(sys.version); print('Py_GIL_DISABLED=',ft,'gil_enabled=',sys._is_gil_enabled()); raise SystemExit(0 if ft else 1)"
      - run: python -m pip install -e ".[nir]"    # torch + numpy are DEFAULT deps -> the full tier runs; [nir] because manifest_gate READS the NIR-HDF5 artifact (needs h5py) -- found by the first local act run, 2026-08-20
      # Brian2 is the canonical equation/event simulator. This self-check runs a real Brian2
      # NeuronGroup in an isolated CPU subprocess (its cp314t extension enables the GIL), compares it
      # with the free-threaded differentiable Torch bridge for all three reset modes, and proves the
      # surrogate path still carries finite gradients. Denying `brian2` at import is the reachable
      # dependency red; changing either equation is the parity red.
      - name: Brian2 reference simulator agrees with the Torch training bridge
        run: python -m snn_data_lake.growth.brian2_backend
      # B2 (Phase 2 PFC kernel): snn_data_lake._native is a HARD build dependency -- the Python PFC body is
      # deleted -- so the extension is built and placed in the package before anything imports the brain.
      - name: Build the native extension into the package (wheel TAG asserted cp314t)
        run: |
          python -m pip install "maturin>=1.15,<2"
          python -m snn_data_lake.infra.native_build
      - name: Run every self-check with the full dependency set
        run: python run_selfchecks.py       # canonical module list lives in run_selfchecks.py
      # specs/022 T001: PERMANENTLY report-only on CI ("CI never hosts performance claims",
      # plan.md). The numbers a runner prints are trend/debug info against the pinned-host
      # baseline; the ASSERT runs only on the pinned measurement host (pre-push, from T012).
      - name: Performance trend row (report-only, never asserts here)
        if: matrix.os == 'ubuntu-latest'
        run: python -m snn_data_lake.gates.perf_baseline --report
      # specs/022 T008: the index is DERIVED state -- delete -> rebuild -> logical equality,
      # with the planted-divergence red and the lake-tracking control proven in the same run.
      - name: Lake index rebuild gate (equality + divergence red + tracking control)
        run: python -m snn_data_lake.gates.lake_rebuild_gate
      # specs/022 T015: correctness, not performance, so it DOES assert here -- byte-identical
      # trains across T=1..16 at the gate's constructed fixed P, V_c/V_ermv both zero, with the
      # float-accumulation broken arm proving the red fires IN THE SAME COMMAND. frac_bits is
      # the pinned-host measurement recorded in tools/determinism_baseline.json (12).
      - name: Determinism gate (T=1..16 byte-equal at fixed P; broken control in-command)
        run: python -m snn_data_lake.gates.determinism_gate --assert
      # specs/022 T017: G5 -- a snapshot resumes THE SAME trajectory (RNG stream positions, not
      # seeds), with the omit-positions and parameter-mismatch refusals and the re-seeded
      # divergence control all in the same command. L7's battery replays through this.
      - name: G5 replay gate (snapshot resume byte-identical; refusal reds in-command)
        run: python -m snn_data_lake.gates.replay_gate --assert
      # specs/022 T019: the wiring-manifest contract checks + the committed-vs-rebuilt
      # divergence red. An EMPTY manifest is stated loudly, never rendered as plain green.
      # The NIR serialization arm inside the module skips loudly where nir is absent; the
      # five structure checks never depend on it.
      - name: Manifest gate (five contract checks + divergence red)
        run: python -m snn_data_lake.gates.manifest_gate --assert
      # specs/022 T021b: an envelope byte change without its same-commit baseline update
      # (the owner-approval act) reds the build. The gate reads and compares; it never
      # touches the envelope.
      - name: Envelope-hash gate (five files vs approved baseline)
        run: python -m snn_data_lake.gates.envelope_hash_gate --assert
      # specs/022 T022: REPORT-ONLY by construction until T039 writes the integer floor
      # (tools/region_charge_floor.json); the census prints either way, so an empty green
      # is impossible. The exemption ratchet DOES bind already.
      - name: Region charge gate (census; floor binds at T039)
        run: python -m snn_data_lake.gates.region_charge_gate --assert
      # specs/022 T024: BINDING from day one -- a NEW phantom (connectome node no module in
      # its region names) or a stale exemption reds the build; the 23 day-one phantoms are
      # recorded rows that may only be deleted, never added to.
      - name: Atlas-node gate (connectome naming census)
        run: python -m snn_data_lake.gates.atlas_node_gate --assert

  wheel:
    name: wheel packages the vendored model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11 -> 3.12 with the floor raise. STATED HONESTLY: unlike `lint` and `test` below, this
          # job was NOT proven to break on 3.11 -- `python -m build --wheel` never INSTALLS the
          # project, so pip's Requires-Python check is not on its path and it would most likely have
          # kept passing. It is bumped because building the distribution on an interpreter the
          # distribution's own metadata excludes is a stale declaration, not because a red was run.
          python-version: "3.14t"
          cache: pip
      # f2-pkg (Codex B2 MAJOR 1): the hatch wheel hook (infra.native_build) compiles snn_data_lake._native
      # inside the isolated build env, so the pinned compiler must be present here too.
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install 1.96.0 --profile minimal
      - run: python -m pip install build
      - name: Build the wheel (the hook builds and ships snn_data_lake._native; tag cp314t, never py3-none-any)
        run: python -m build --wheel
      # The editable install CI otherwise uses resolves assets through the source tree, so a
      # packaging mistake is invisible until someone installs the wheel. Assert the model is in it.
      - name: Assert the SO-101 model is inside the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(whl).namelist())
          need = "snn_data_lake/brainstem/so101/scene.xml"
          stls = [n for n in names if n.endswith(".stl")]
          print(f"wheel: {whl}")
          print(f"scene.xml present: {need in names}")
          print(f"stl meshes packaged: {len(stls)}")
          if need not in names or len(stls) != 13:
              sys.exit("WHEEL IS MISSING THE VENDORED MODEL -- check .gitignore does not "
                       "swallow the asset directory (hatchling honours it)")
          PY
      # The extension is gitignored and the wheel is the only artifact an installer sees, so the check
      # is on the INSTALLED copy, imported from outside the source tree (src/ would otherwise shadow it).
      - name: Install the wheel into a temp target and import snn_data_lake._native from it
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-target" dist/*.whl
          cd "$RUNNER_TEMP/wheel-target"
          python -c "import snn_data_lake._native as n; print(n.__file__); assert 'wheel-target' in n.__file__, n.__file__"

  lint:
    name: lint (ruff) + repo hygiene
    runs-on: ubuntu-latest
    steps:
      # Full history: gates/null_scale_gate.py (P8 null-scale) reads git history to expire a PENDING re-test
      # at the next pushed arc, and reds "history unavailable" on a shallow clone rather than passing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # 3.11 -> 3.12, AND THIS ONE IS A PROVEN BREAK, not a tidy-up. With
          # `requires-python = ">=3.12"` the very next step (`pip install -e ".[dev]"`) fails on a
          # 3.11 runner: measured in .venv-lake (3.11.15, pip 24.0), "ERROR: Package ... requires a
          # different Python: 3.11.15 not in '>=3.12'", exit 1. Leaving this pin would have reddened
          # the whole lint job -- including the two gates added below it.
          python-version: "3.14t"
          cache: pip

      # P4c (every build is part of the brain) -- THE RATCHET. P4c's forward-looking half, "every
      # FUTURE build lands inside the governed tree from the start", was enforced by REVIEW ONLY,
      # and review is precisely what let 259 ungoverned builds accumulate. This step does not
      # promote or disposition anything; it asserts one thing only: the per-zone count of builds
      # outside REGIONS/TORCH_TIER may FALL and may never RISE.
      #
      # `--assert` IS NOT OPTIONAL, for the reason this file now records three times: a gate wired
      # in BARE is a log line wearing a gate's clothes (`dependency_ledger.py` ran that way for
      # weeks and could not redden the build no matter what it found).
      #
      # PROVEN ABLE TO FIRE against the REAL tree, constructed and run 2026-08-06 in .venv-lake --
      # not reasoned about from the source. Four probes, each created on disk, gate run, probe
      # deleted, gate re-run: (1) research/_p4c_red_probe.py -> "research: 26 > baseline 25", exit
      # 1; (2) src/snn_data_lake/cortex/_p4c_red_probe.py -> "src/snn_data_lake/cortex: 1 >
      # baseline 0", exit 1 -- a file INSIDE a governed region directory still fires, because
      # registration is the test and location is not; (3) a brand-new top-level skunkworks/ ->
      # exit 1 on an implicit baseline of 0; (4) `--update-baseline` REFUSED to absorb probe 3,
      # exit 1, so the regeneration flag cannot launder a violation into the baseline. Every probe
      # removal returned the same command to exit 0.
      #
      # PLACED BEFORE `pip install` DELIBERATELY, and this is the load-bearing half of the
      # placement: the gate is stdlib-only and reads REGIONS with `ast` rather than importing
      # `snn_data_lake`, so it needs no torch, no numpy, no GPU and no Brain -- running it before
      # the install PROVES that structurally instead of asserting it in a comment. It also removes
      # any chance an editable-install artifact lands an untracked .py in the tree and inflates the
      # corpus. (Measured on a tree that already carries an editable install: `git ls-files
      # --cached` = 547 and `--cached --others --exclude-standard` = 547, delta 0. Belt and braces.)
      # It needs the git index, which actions/checkout provides; the default shallow fetch is fine,
      # exactly as for the citation guard below.
      - name: P4c ratchet (builds outside the governed tree may only go DOWN)
        run: python tools/p4c_ratchet.py --assert

      # ...and the ratchet's OWN criteria must be falsifiable, which is the other half P8 asks for.
      # `--self-check` mutates synthetic in-memory counts (nothing on disk is read or written) once
      # per criterion and requires each mutation to move its criterion; a mutation that changed
      # nothing is reported BROKEN rather than passing quietly. It leads with a SENSITIVITY CONTROL
      # -- an unmutated corpus must produce zero findings, because a comparator that fires on a
      # clean tree makes every red below it meaningless -- and it carries the two directions that
      # matter as explicit controls: a legitimate promotion (a count going DOWN) must stay GREEN,
      # and cross-zone laundering (retire 5 in reasoning/, add 5 in tools/, total unchanged) must
      # still FIRE. Measured 2026-08-06 in .venv-lake: 7 RED OK, 0 NO RED, 0 BROKEN, exit 0.
      # The self-check was itself mutation-tested: four broken comparators (always-green,
      # always-red, `>=` for `>`, and absent-zone-treated-as-unbounded) were injected in memory and
      # `--self-check` went red on 4 of 4, so it has discriminating power rather than a standing
      # green.
      - name: P4c ratchet criteria can fail (--self-check)
        run: python tools/p4c_ratchet.py --self-check

      # R0.4 (plan section 9): the pinned Rust toolchain from rust-toolchain.toml. Every Rust-aware
      # gate (rust_facts self-check, native_dormancy, import_manifest, eprop/gradient_claim,
      # dependency_ledger) builds tools/rsfacts even with native/ ABSENT, so the compiler must be the
      # pinned one on every job that runs them, not whatever the runner image ships (1.99 today).
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests tools   # whole tree is ruff-formatted (2026-07-20 project-wide format)
      # A tracked file may not present an UNTRACKED .py as a runnable reproduction path -- asserting
      # since 2026-07-30, after the 21 findings of the counted run were cleared. It lives HERE rather
      # than in run_selfchecks.py deliberately: run_selfchecks only executes `python -m
      # snn_data_lake.<mod>` package modules, so moving it into the package to be picked up there would
      # change the canonical 277 self-check count that README.md, docs/RUNNING.md, CONTRIBUTING.md,
      # docs/POLICIES.md and docs/AIRLLM_ANALYSIS.md all quote -- churn in five documents to gate a
      # repo-hygiene check that is not a brain-faculty self-check. It needs the git index, which
      # actions/checkout provides; `git ls-files` reads the index, so the default shallow fetch is fine.
      - name: Citations resolve (no tracked file cites an untracked .py as runnable)
        run: python tools/citation_guard.py

      # P8 (specs/010): a success criterion with no reachable RED is worthless and is DELETED, not
      # weakened. ASSERTING from the start because it is clean on this tree with zero findings to
      # disposition -- and because it has been proven able to fire: tests/test_red_reachability.py
      # reconstructs the pre-fix consciousness_probe (RETIRED at T081, 2026-09-16) and checks every bucket lights up. A gate that
      # has only ever been seen green is indistinguishable from one that cannot see.
      - name: Criteria can fail (no zero-argument or self-asserting success criterion)
        run: python tools/red_reachability.py --assert

      # P7 (specs/010): every import declared, every declaration used.
      #
      # NOW ASSERTING. This step ran BARE until 2026-08-05, and the comment here justified that with
      # "it exits 1 on four real, undispositioned findings (arcengine + nir undeclared; pillow +
      # pyarrow unused)". BOTH HALVES OF THAT WERE FALSE BY THE TIME ANYONE READ THEM:
      #   (1) the findings are gone -- re-run 2026-08-05 in .venv-lake, `dependency_ledger.py`
      #       prints "UNDECLARED: 0   UNUSED: 0   MISDESCRIBED: 0   EXEMPT: 2   ALL_EXCLUDES: 8"
      #       and "gate OK". arcengine and nir are declared; pillow and pyarrow are dispositioned
      #       EXEMPT with written reasons;
      #   (2) the bare form NEVER exited 1 in the first place, and that is not a stale number but a
      #       structural fact: `main()` returns 1 only under `if do_assert and failed`, and
      #       `do_assert` is `"--assert" in sys.argv`. RUN 2026-08-05, not read -- a mutated STRING
      #       COPY of pyproject (a `zzznew` extra in neither [all] nor ALL_EXCLUDES) fed to the same
      #       `main()` gives rc=1 with `--assert` and **rc=0 bare**, both printing the identical
      #       "gate FAIL: the dependency ledger does not balance". So this step could not redden the
      #       build no matter what it found. A gate that cannot fail is not a gate; it is a log
      #       line, and `dependency_ledger` is named in 9 tracked `.md` documents.
      # The flag is added, not deferred to T021/T062, because the findings it was waiting on are
      # already at zero and a green-by-construction step is exactly what P8 forbids.
      - name: Dependency ledger (every import declared, every declaration used)
        run: python tools/dependency_ledger.py --assert

      # ...and the ledger's OWN criteria must be falsifiable, which is the other half P8 asks for.
      # `--self-check` mutates a STRING COPY of pyproject (nothing on disk is touched) once per
      # MISDESCRIBED criterion and requires each mutation to make its criterion fire; it also fails
      # loudly on a mutation that changed nothing, so a rotted anchor cannot present as a vacuous
      # green. It has run NOWHERE until now -- not in CI, not in run_selfchecks.py, not in
      # pre-commit -- so the "5/5 criteria proven falsifiable" line it prints was a claim nothing
      # re-derived. Registered here on the pattern the red_reachability step above already uses.
      # Measured 2026-08-05 in .venv-lake: 5 RED OK, 0 NO RED, 0 BROKEN, exit 0.
      - name: Dependency ledger criteria can fail (--self-check)
        run: python tools/dependency_ledger.py --self-check

      # plan section 10 R0.3: the C/C++ -> Rust migration meter. Counts DISTINCT src/ importers of
      # each C/C++-backed library (numpy, torch, scipy, scikit-learn, pyarrow, pygenn, mujoco,
      # brian2, zlib, struct), per library, per package and as a union, reusing the ledger's own
      # import walk; every count may only FALL. First output 2026-10-17 reproduced section 10's
      # scope exactly (numpy 97, torch 58, zlib 67, struct 22, mujoco 5, scipy 2, scikit-learn 2,
      # pygenn 2, brian2 1, pyarrow 1; union 134).
      - name: Native ratchet (C/C++-library importers may only go DOWN)
        run: python -m snn_data_lake.gates.native_ratchet --assert

      # ...and its criteria must be falsifiable: a constructed rise-by-one per library and a
      # package-only rise must red, a fall must stay green.
      - name: Native ratchet criteria can fail (--self-check)
        run: python -m snn_data_lake.gates.native_ratchet --self-check

      # P6 (every build must reach every other AND actually use it). Was the last policy whose gate
      # existed but enforced nothing: `tools/p6_gate.py` ran clean, self-checked, and was MANUAL,
      # NON-ASSERTING and not in CI, so P6 stayed review-enforced and provisional.
      #
      # `--assert` IS THE WHOLE POINT AND IT IS NOT OPTIONAL HERE. The lesson is recorded twice on
      # this file already: `dependency_ledger.py` ran BARE for weeks, returned 1 only under
      # `if do_assert and failed`, and therefore COULD NOT REDDEN THE BUILD no matter what it found.
      # A gate wired into CI without its assert flag is a log line wearing a gate's clothes.
      #
      # PROVEN ABLE TO FIRE, end to end, not by reading the code. Seven regressions were each
      # injected ON DISK into a `git archive` copy of 4fc5fb1c, one at a time, and this exact
      # command was run over the result with --root: (1) a new faculty holding its own private
      # GlobalWorkspace, (2) that faculty submitting with no reader, (3) live_brain repointed off
      # the arm's bus onto its own, (4) the one cross-module read deleted outright, (5) an
      # amygdala->cerebellum import with no declared pathway, (6) THE SAME WIRE SPELLED AS A
      # RELATIVE IMPORT, (7) a connectome edge no import implements. All seven exit 1; the same
      # command on the real tree exits 0. Separately, a single file that merely FAILS TO PARSE (a
      # UTF-8 BOM) also exits 1 -- before that fix a dropped file made every count SMALLER, so the
      # tree looked CLEANER.
      #
      # THE OTHER DIRECTION WAS MEASURED TOO, and it is the half that nearly shipped broken. Three
      # pieces of CORRECT work were constructed the same way and required to stay GREEN: a new
      # faculty submitting into the one SHARED bus live_brain reads (the P6 fix itself), a
      # behaviour-preserving hoist of that read into an attribute, and one more private-bus SITE
      # inside an already-private module. The first two were RED before this revision -- the gate
      # fired on the fix and on a no-op refactor -- which is the property this project rejected the
      # private-instance SITE count for. Both are now pinned as controls inside --self-check.
      #
      # AST-only and stdlib-only by construction: no GPU, no torch, no Brain, and it never imports
      # the package under test (verified by running main() in-process and inspecting sys.modules:
      # zero of torch/numpy/snn_data_lake/mujoco/sklearn/scipy present). Determinism: 11 runs,
      # including one from a different working directory, gave byte-identical stdout. Measured wall
      # time in .venv-lake on the free-threaded interpreter: 3.3s for --assert, 35s for
      # --self-check, which re-walks the 400-file tree once per constructed mutation and control.
      - name: P6 gate (workspace topology + connectome diff, ratchets must not regress)
        run: python tools/p6_gate.py --assert

      # ...and the P6 gate's OWN criteria must be falsifiable, which is the other half P8 asks for.
      # `--self-check` proves the walk is still SEEING (a broken walk resolves to zero findings, which
      # reads exactly like a clean tree) and then CONSTRUCTS AND RUNS one mutation per asserting
      # criterion against an in-memory overlay of the tree -- nothing on disk is touched, the same
      # string-copy discipline the dependency-ledger self-check uses on pyproject. A mutation that
      # moves no number fails loudly, so a rotted anchor cannot present as a vacuous green. It then
      # runs the GREEN CONTROLS: correct work that must NOT fire, because a criterion red on a
      # regression and red on the fix has no green state and so no discriminating power.
      # Measured 2026-08-06 in .venv-lake: 6 of 6 mutations fired across 5 of 5 criteria, 3 of 3
      # controls stayed green, exit 0.
      - name: P6 gate criteria can fail (--self-check)
        run: python tools/p6_gate.py --self-check

      # specs/022 T046: invention register row 7's four instruments, mechanized and COUNTED
      # before any rule lands (the gate-before-rule invariant). Lives in substrate/, NOT
      # tools/ -- the panel measured the tools/ draft REDDING p4c_ratchet in THIS job before
      # its own steps ran. Sits after pip install (unlike the ratchet pair) because it
      # imports the real arealization/growth_program/placement symbols -- policing the
      # PRODUCTION labelers is the point (the panel poisoned discretize_sharp and the
      # inline-copy draft stayed green). Asserts: the identity-pinned coverage ratchet
      # ({cortex}, per-site AST census with an <unresolved> red -- the draft fabricated
      # "cortex" for any non-literal region argument); REFUSALS for censused growth into
      # SCAFFOLD (brainstem included) / CHARGED-NEVER-GROWN / undeclared names; the exact
      # three-way partition; sharp-width-0 via the production discretize_sharp (0 BY
      # CONSTRUCTION, stated -- the reachable red is the symbol dependency) vs the graded
      # modal-label width under noise; the scrambled-FIELD spatial null; ELEMENTWISE Allen
      # macro agreement (ARI alone is name-blind: a singleton region's move is invisible --
      # ARI + its permutation null stay as display). DAY-ONE COUNT in every run's output:
      # coverage 1 of 10 -- BELOW FLOOR (cortex-only). Green means the ratchet held, the
      # refusals are empty and the instruments discriminate; NEVER that coverage is adequate.
      - name: Growth coverage gate (T046, --assert)
        run: python -m snn_data_lake.gates.growth_coverage_gate --assert

      - name: Growth coverage gate criteria can fail (--self-check)
        run: python -m snn_data_lake.gates.growth_coverage_gate --self-check

      # The e-prop invariant's SCOPE gate: which learning rules OWE a gradient cosine at all. A
      # FOURTH question, distinct from the three gates above it -- eprop_transport_gate asks "is there
      # a rule NOBODY CHECKED?", dormancy_gate asks "is this module reachable?", method_dormancy_gate
      # asks "does this learning method have a live caller?". None of them can answer whether a given
      # rule owes the bar, which is why ~22 local rules shipped for months under a nickname
      # ("e-prop only") that no policy text ever said.
      #
      # It is REGISTERED in run_selfchecks too, and that registration was DECORATIVE for one commit:
      # run_selfchecks invokes each module through `runpy.run_module(run_name="__main__")` with NO
      # argv, and this module's default path was pure report, exiting 0 regardless of findings. That
      # is the failure this file already records three times. Fixed by making the bare path assert
      # like every sibling (dormancy_gate and method_dormancy_gate carry no --assert flag at all);
      # verified by planting a real finding, after which runpy raises SystemExit=1 and SystemExit=0
      # without it. The step below is kept ANYWAY: the lint job is where a scope regression should be
      # named explicitly rather than inferred from a self-check line.
      #
      # ast-only over the package; it never imports the modules it CLASSIFIES, which is required
      # rather than stylistic -- ~25.7% of the ungoverned subtree does not import in the gate env, and
      # a classifier that skips what it cannot import silently UNDER-COUNTS. It does lazily import two
      # SIBLING modules (dormancy_gate for the governed set, self_mod_harness for the repo root);
      # torch is NOT loaded. No GPU, no Brain. Measured wall time in .venv-lake: 1.4s for --assert.
      - name: Gradient-claim census (e-prop scope; every governed rule classified)
        run: python -m snn_data_lake.gates.gradient_claim_gate --assert

      # ...and its criteria must be falsifiable. --self-check CONSTRUCTS its reds against the REAL
      # tree through an in-memory overlay (nothing on disk is touched -- the same string-copy
      # discipline p6_gate and the dependency ledger use) and then runs GREEN CONTROLS: the
      # repaired/truthful shapes must NOT fire, and two runs must be byte-identical. Measured
      # 2026-08-17: 6 of 6 constructed mutations fired, both controls held, exit 0, 13.3s.
      # Re-measured 2026-08-27 (PHANTOM_DECLARATION landing): 8 reds fired, 3 green controls held,
      # incl. the governed+ungoverned phantom pair and the T050 wrong-class shape.
      # Re-measured 2026-08-27 (unclassified ALL-scope landing): 11 reds fired, 4 green controls
      # held -- RED 9's governed+ungoverned escaped-state pair through main()'s assert composition,
      # plus its unpoisoned-census control. (The prior line's "8 reds" under-counted its own tree
      # by one: 9 RED prints existed at that commit.)
      #
      # Worth naming because it was found the hard way: the reds are re-verified by MUTATING THE
      # MODULE and confirming each test goes red. One escapee that survived was a guard test whose
      # probe symbol was never enumerated at all, so it asserted over an empty list -- a vacuous check
      # that read as a passing one until the mutation exposed it.
      - name: Gradient-claim census criteria can fail (--self-check)
        run: python -m snn_data_lake.gates.gradient_claim_gate --self-check

      # Policy manifest (specs/021): the MAP must be honest before the territory is judged --
      # derivation reconciles (parents + table_only == table rows), the committed
      # tools/policy_manifest.json byte-matches a fresh derivation, and the unclaimed-gate census
      # never grows past the counted baseline (it may shrink to empty as US4 claims rows).
      # Executes NO gate commands: this job already runs them; asserting the map twice buys nothing.
      # Measured wall time in .venv-lake: <1s.
      - name: Policy manifest assert (derivation + committed-copy sync + drift ratchet)
        run: python -m snn_data_lake.gates.policy_manifest --assert

      # ...and its verdicts must be falsifiable: FAIL, CANNOT_RUN, NO_GATE, empty-walk,
      # reconciliation-mismatch and the certify-refusal red are each CONSTRUCTED and must fire.
      - name: Policy manifest verdicts can fail (--self-check)
        run: python -m snn_data_lake.gates.policy_manifest --self-check

      # P8 null-scale amendment (2026-10-23): every null names its scale; deleting on a null waits for one
      # 10x re-test; a PENDING re-test or scale-retest exemption expires before the next pushed arc.
      - name: P8 null-scale gate (records, re-test scale, arc expiry)
        run: python -m snn_data_lake.gates.null_scale_gate --assert

      - name: P8 null-scale gate reds can fire (--self-check)
        run: python -m snn_data_lake.gates.null_scale_gate --self-check

  test:
    name: tests + coverage
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: disable   # tests simulate, never render (see self-checks)
    steps:
      # Full history for the same reason as self-checks: run_selfchecks --in-process runs the P8 null-scale gate.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # 3.11 -> 3.12: same proven break as `lint` -- this job also runs `pip install -e ".[dev]"`.
          python-version: "3.14t"
          cache: pip
      - run: python -m pip install -e ".[dev,nir]"   # [nir]: the manifest tests read the HDF5 artifact (h5py) -- 2026-08-20
      # R0.4 (plan section 9): the pinned Rust toolchain from rust-toolchain.toml. Every Rust-aware
      # gate (rust_facts self-check, native_dormancy, import_manifest, eprop/gradient_claim,
      # dependency_ledger) builds tools/rsfacts even with native/ ABSENT, so the compiler must be the
      # pinned one on every job that runs them, not whatever the runner image ships (1.99 today).
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      # R0.4: the native workspace's own tests (sndl-core RNG parity against tests/fixtures_rng.json,
      # P8 mutants) run here, on the pinned toolchain, before the Python suite.
      - name: cargo test (native workspace)
        run: cargo test --manifest-path native/Cargo.toml
      - name: Build the native extension into the package (maturin from the [dev] extra)
        run: python -m snn_data_lake.infra.native_build
      # Owner 2026-10-19 (option A): the self-checks run ONCE, in-process (CORE + TORCH_GATED in one
      # interpreter: the cross-module leak detector) under coverage; pytest then APPENDS, so the 70% bar
      # counts them. The subprocess isolation run is the selfchecks job above (run_selfchecks.py).
      - name: Self-checks in-process under coverage
        run: python -m coverage run run_selfchecks.py --in-process
      # the 70% bar is checked ONCE, on the last run (it appends to everything before it), so a
      # low partial total can never skip the serial timing step below (B3 item f, 2026-10-19)
      - run: pytest -n auto --dist loadgroup --cov-append --cov-fail-under=0 -m "not timing"
      - name: Wall-clock repeatability tests, serially (marker `timing`)
        run: pytest --cov-append -m timing   # addopts: --cov-fail-under=70 on the combined data

  # Release audit (specs/021, FR-014): every push to main gets audited -- --certify runs every
  # manifest row's real gate command and refuses while any policy is FAIL / CANNOT_RUN / NO_GATE
  # or an unclaimed gate exists. NON-BLOCKING initially (continue-on-error): main is not gated on
  # the census rows landing; flipping this job to required once it goes green is a recorded owner
  # decision, not a CI edit that happens by accident. The refusal is loud in the job summary and
  # the certification record is published as an artifact either way.
  certify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Full history: --certify runs every policy's gate, the P8 null-scale gate among them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # "3.14t" NOT "3.14": the package's import guard requires the free-threaded build
          # (cp314t). The first run of this job used "3.14" and failed at import -- the guard
          # working, exactly as the self-checks matrix comment above predicts.
          python-version: "3.14t"
          cache: pip
      - name: Install (CPU torch tier)
        run: pip install -e ".[dev]"
      - name: Release audit (--certify; refusal is honest, not fatal to main)
        run: |
          python -m snn_data_lake.gates.policy_manifest --certify | tee certify.out
          rc=${PIPESTATUS[0]}
          echo "## Policy certification" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 30 certify.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Publish certification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-certification
          path: tools/policy_certification.json
