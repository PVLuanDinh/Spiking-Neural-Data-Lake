<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiking Neural Data Lake - Brain Chat</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #24211d;
    --muted: #6b6a66;
    --faint: #94938e;
    --border: #e7e5df;
    --user-bubble: #eceae3;
    --assistant-bubble: #ffffff;
    --accent: #c56a3a;
    --accent-hover: #a9562d;
    --accent-contrast: #ffffff;
    --caption: #8a887f;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 12px rgba(0,0,0,0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1e1c;
      --panel: #262523;
      --text: #ecebe6;
      --muted: #a5a39c;
      --faint: #7f7d75;
      --border: #38352f;
      --user-bubble: #34322d;
      --assistant-bubble: #2b2a27;
      --accent: #d47b4c;
      --accent-hover: #e08a5c;
      --accent-contrast: #1f1e1c;
      --caption: #8f8d84;
      --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 1px 12px rgba(0,0,0,0.2);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
                 "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  header {
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px;
    flex: 0 0 auto;
  }
  .header-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand {
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 0.1px;
  }
  .subtitle {
    font-size: 12.5px;
    color: var(--muted);
  }
  .status {
    margin-left: auto;
    font-size: 12px;
    color: var(--faint);
    white-space: nowrap;
  }
  .status b { color: var(--muted); font-weight: 600; }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  #messages {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; flex-direction: column; }
  .row.user { align-items: flex-end; }
  .row.assistant { align-items: flex-start; }
  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    box-shadow: var(--shadow);
  }
  .row.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 5px;
  }
  .row.assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
  }
  .caption {
    margin-top: 5px;
    font-size: 11.5px;
    color: var(--caption);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.1px;
    padding: 0 4px;
    max-width: 82%;
  }
  .caption code {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 11px;
  }
  .welcome .bubble { background: transparent; border: 1px dashed var(--border); box-shadow: none; }
  .welcome kbd {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: 12px;
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
  }

  /* typing indicator */
  .dots { display: inline-flex; gap: 4px; align-items: center; height: 20px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--faint);
    animation: blink 1.3s infinite ease-in-out both;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  footer {
    flex: 0 0 auto;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px 20px 16px;
  }
  #composer {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 14px;
  }
  #composer:focus-within { border-color: var(--accent); }
  #input {
    flex: 1 1 auto;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    line-height: 1.5;
    max-height: 200px;
    padding: 6px 0;
    overflow-y: auto;
  }
  #input::placeholder { color: var(--faint); }
  #send {
    flex: 0 0 auto;
    border: none;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-contrast);
    font: inherit;
    font-weight: 600;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #send:hover:not(:disabled) { background: var(--accent-hover); }
  #send:disabled { opacity: 0.45; cursor: default; }
  .hint {
    max-width: 760px;
    margin: 8px auto 0;
    font-size: 11.5px;
    color: var(--faint);
    text-align: center;
  }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="brand">Spiking Neural Data Lake &mdash; Brain Chat</span>
      <span class="subtitle">a functional spiking model &mdash; grounded replies, not a large language model</span>
      <span class="status" id="status"></span>
    </div>
  </header>

  <main id="scroll">
    <div id="messages"></div>
  </main>

  <footer>
    <form id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Message the spiking brain&hellip;  (Enter to send, Shift+Enter for a new line)"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="hint">Every message runs through a real spike encoder &rarr; the durable data lake &rarr; a spike-pattern intent decision &rarr; a grounded decode.</div>
  </footer>

<script>
(function () {
  "use strict";

  var messages = document.getElementById("messages");
  var scroller = document.getElementById("scroll");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var form = document.getElementById("composer");
  var statusEl = document.getElementById("status");

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function scrollToBottom() {
    scroller.scrollTop = scroller.scrollHeight;
  }

  // Append a message row. `captionHtml` is trusted HTML (we build it ourselves); text is escaped.
  function addMessage(role, text, captionHtml, extraClass) {
    var row = document.createElement("div");
    row.className = "row " + role + (extraClass ? " " + extraClass : "");
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = escapeHtml(text);
    row.appendChild(bubble);
    if (captionHtml) {
      var cap = document.createElement("div");
      cap.className = "caption";
      cap.innerHTML = captionHtml;
      row.appendChild(cap);
    }
    messages.appendChild(row);
    scrollToBottom();
    return row;
  }

  function pipelineCaption(d) {
    var spikes = (typeof d.input_spikes === "number") ? d.input_spikes : "?";
    var lake = (typeof d.lake_events === "number") ? d.lake_events : "?";
    var intent = escapeHtml(d.intent != null ? d.intent : "unknown");
    var conf = (typeof d.confidence === "number") ? d.confidence.toFixed(2) : "?";
    return spikes + " spikes encoded &rarr; lake " + lake + " events &rarr; intent: <code>" +
           intent + "</code> (conf " + conf + ") &rarr; decoded";
  }

  function setStatus(d) {
    if (!d) return;
    var goal = (d.goal != null && d.goal !== "") ? d.goal : "(forming)";
    statusEl.innerHTML = "goal <b>" + escapeHtml(goal) + "</b> &middot; lake <b>" +
      (d.lake_events != null ? d.lake_events : "?") + "</b> &middot; wm <b>" +
      (d.wm_events != null ? d.wm_events : "?") + "</b>";
  }

  // typing indicator (a temporary assistant bubble)
  function showTyping() {
    var row = document.createElement("div");
    row.className = "row assistant";
    row.id = "typing";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    row.appendChild(bubble);
    messages.appendChild(row);
    scrollToBottom();
  }
  function hideTyping() {
    var t = document.getElementById("typing");
    if (t) t.parentNode.removeChild(t);
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }

  var busy = false;
  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    input.disabled = v;
    if (!v) input.focus();
  }

  async function send() {
    var text = input.value.trim();
    if (!text || busy) return;
    addMessage("user", text);
    input.value = "";
    autoGrow();
    setBusy(true);
    showTyping();
    try {
      var resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      hideTyping();
      var data = await resp.json().catch(function () { return null; });
      if (!resp.ok || !data || data.error) {
        var msg = (data && data.error) ? data.error : ("request failed (" + resp.status + ")");
        addMessage("assistant", "[error] " + msg, null, "error");
      } else {
        addMessage("assistant", data.reply, pipelineCaption(data));
        setStatus({ goal: data.goal, lake_events: data.lake_events, wm_events: data.wm_events });
      }
    } catch (err) {
      hideTyping();
      addMessage("assistant", "[error] could not reach the server. Is it running?", null, "error");
    } finally {
      setBusy(false);
    }
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); send(); });
  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // seed welcome message (honest framing, no sentience/LLM claim)
  var welcome =
    "Hi — I am a functional spiking brain, not a chatbot and not a large language model. " +
    "Each message you send is encoded into real spikes, stored in a durable data lake, matched " +
    "to an intent by its spike pattern, and answered from my actual internal state.\n\n" +
    "Try:  • hello   • what is your goal   • are you conscious   • close the effector\n\n" +
    "The caption under each reply shows the spikes that produced it.";
  addMessage("assistant", welcome, null, "welcome");

  // fetch initial status (best effort)
  fetch("/api/state").then(function (r) { return r.ok ? r.json() : null; })
    .then(setStatus).catch(function () {});

  autoGrow();
  input.focus();
})();
</script>
</body>
</html>
