# Installable src/ package (snn_data_lake). torch + numpy + mujoco are UNCONDITIONAL core dependencies, so
# `pip install .` gives the full brain tier out of the box. `pip install ".[all]"` adds every addon
# (arm+lake+gpu+nmnist+train); training is a first-class GPU tier (.[train] -> snn-train).
#
# The NORD_TORCH=0 off-switch is GONE as of 2026-07-29 -- removed from the brain, the atlas, the
# self-check runner, the pytest bootstrap, the two module self-checks that set it, and the frozen-exe
# entry point. It was the last mechanism implementing the zero-dependency rule that this file had
# already declared removed on 2026-07-20, nine days earlier, and a flag that outlives its rule reads
# as a supported configuration. Nothing degraded by deleting it: torch genuinely ABSENT still lands on
# the stdlib tier, because both call sites reach that tier by CATCHING the failed import rather than
# by consulting the flag. The flag's only unique power was disabling the tier while torch was present,
# which is the simulation being retired, not a capability.
#
# DEPENDENCY SCOPE (user policy 2026-07-20): the zero-dependency rule is REMOVED entirely,
# project-wide -- there is no zero-dep-core contract and no pure-stdlib purity gate. New
# dependencies MAY be added as the project grows, and the user VERIFIES each one. numpy is a core dep
# (the brain-native language acquisition + growth/learning tiers use it); the interactive-viz stack
# (matplotlib/netplotbrain/pandas/scikit-image/nibabel/templateflow) lives in the [viz] extra. Keep
# every addition justified and surfaced for verification.
#
# SUPERSEDED BY P7 (owner policy 2026-08-04, docs/POLICIES.md): any dependency or framework that helps
# this become a phenomenal brain is ACCEPTED, including any that helps the brain become sentient.
# This comment's closing clause used to read "prefer stdlib when it is genuinely sufficient"; P7
# retires it by name, because it is the residual brake that was still producing hand-rolled code
# twelve days after the rule above was abolished (three hand-written linear solvers, a hand-written
# PNG encoder while pillow sits declared-and-unimported below, a from-scratch Potjans-Diesmann column
# importing only math and random). "It would be another dependency" is NOT a reason to reject
# anything: a rejection must cite a measurement on the real workload or a structural argument about
# this architecture. Adoption still ships with the measurement of what it bought, and a dependency
# may never become a second durable store (P4b) nor carry its own BPTT trainer into a learning path.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiking-neural-data-lake"
version = "4.80.0"
description = "Neuromorphic gesture -> robot-arm control loop + spiking data lakehouse. torch, numpy and mujoco are core dependencies."
readme = "README.md"
# FLOOR RAISED 3.12 -> 3.14, 2026-08-05 (owner decision), and this floor is NOT the whole
# requirement. The project requires the FREE-THREADED (PEP 703) build, and `requires-python` cannot
# express that: free-threading is a BUILD of an interpreter, not a language level. `>=3.14` is the
# half the packaging metadata can carry; the other half is a RUNTIME guard in
# `src/snn_data_lake/__init__.py` that refuses to import under a GIL-enabled interpreter, because a
# silent fallback to the GIL build is precisely the failure this project would not notice -- every
# self-check would pass, single-threaded, and the parallelism would simply not be there.
# The ABI tag for the required build is cp314t. Verified available on win_amd64 for all three core
# dependencies before this floor moved: torch-2.13.0-cp314-cp314t-win_amd64.whl,
# mujoco-3.11.0-cp314-cp314t-win_amd64.whl, numpy-2.5.1-cp314-cp314t-win_amd64.whl. The mujoco one
# was the gating question, since that pin is exact BECAUSE the solver version is the physics.
requires-python = ">=3.14"
# FLOOR RAISED 3.11 -> 3.12, 2026-08-05 (owner decision). The reason is the [arc] extra below:
# `arcengine` declares `Requires-Python: >=3.12`, so under a ">=3.11" floor its spec needed the
# environment marker `python_version >= "3.12"` to stay resolvable -- and that marker evaluates
# False on 3.11, so `pip install ".[arc]"` resolved BY INSTALLING NOTHING while
# reasoning/arc_agi/{play,play_brain}.py import `arcengine` UNGUARDED at module top and ship in the
# wheel. There was no install command that made them importable on a supported interpreter. Raising
# the floor makes the marker vacuously true on every supported interpreter, so the marker is gone.
#
# THE PRICE, WRITTEN DOWN RATHER THAN PAPERED OVER: THE CPU GATE VENV NO LONGER CONFORMS TO THIS
# FLOOR. `.venv-lake` is **Python 3.11.15** -- measured 2026-08-05, twice: `.venv-lake/pyvenv.cfg`
# reads `version = 3.11.15`, and `.venv-lake/Scripts/python.exe --version` prints `Python 3.11.15`.
# That venv is the deterministic CPU gate env named throughout docs/POLICIES.md P5 and
# docs/RUNNING.md, and EVERY MEASUREMENT RECORDED IN THIS REPO WAS TAKEN IN IT.
#
# The consequence is MEASURED, not predicted -- pip enforces this field and refuses the install.
# Constructed and RUN 2026-08-05 in `.venv-lake` (pip 24.0) against two hand-built wheels differing
# in nothing but this one metadata line:
#     Requires-Python: >=3.11  ->  "Would install reqpy-floor311-0.0.1"                     exit 0
#     Requires-Python: >=3.12  ->  "ERROR: Package 'reqpy-floor312' requires a different
#                                   Python: 3.11.15 not in '>=3.12'"                        exit 1
# (Both lines RE-RUN independently 2026-08-05 by a second pass, from wheels rebuilt from scratch, and
# the control/red pair reproduces exactly. One transcription error was found and fixed doing it: this
# block quoted `"Would install reqpy_floor311-0.0.1"` with an UNDERSCORE. pip prints the DISTRIBUTION
# name, which is hyphenated -- `reqpy-floor311-0.0.1`; the underscore is the wheel FILENAME's
# normalization. A quoted-verbatim line has to be pasted from the run, not reconstructed from the
# artifact's filename, or it is a paraphrase wearing quotation marks.)
# So `pip install -e .` and `pip install -e ".[dev]"` into `.venv-lake` FAIL from this commit
# forward. The venv is deliberately NOT recreated here -- that is the orchestrator's call, and
# recreating it invalidates the measurement baseline of every number in docs/. Until it is
# recreated on 3.12, the gate env and the declared floor DISAGREE, and that disagreement is a known
# open item recorded here rather than an oversight discovered later.
license = "MIT"
authors = [{ name = "Aighluvsekks" }]
keywords = ["spiking-neural-network", "neuromorphic", "robotics", "data-lakehouse", "stdp"]
# Classifiers track the CI matrix, which is {3.12, 3.13} as of this commit (.github/workflows/ci.yml,
# job `self-checks`). This list read "Python :: 3.11" alone while the matrix tested three versions.
classifiers = [
    # 3.12 and 3.13 REMOVED 2026-08-05 with the >=3.14 floor: `requires-python` already excludes
    # them, so leaving the classifiers would have advertised support the metadata refuses to install.
    # The gate env `.venv-lake` IS 3.14.6 free-threading, so this is not aspirational -- it names the
    # interpreter every number in docs/ is now measured on.
    "Programming Language :: Python :: 3.14",
    # There is NO classifier for the free-threaded build, which is why the real requirement lives in
    # `src/snn_data_lake/__init__.py::_require_free_threaded` and in ci.yml's explicit
    # Py_GIL_DISABLED assertion. Recorded here so a reader of this list does not conclude that a
    # GIL-enabled 3.14 is supported: it installs, and then refuses to import.
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "numpy",
    # THE BODY. Owner directive 2026-08-01: the MuJoCo SO-101 replaces the 2-DOF kinematic
    # ArmSim as the arm, so the physics engine is core rather than an extra.
    # EXACT PIN, not a floor, on this file's own recorded precedent for ruff ("a formatter's
    # version is part of the format"): for a physics engine the SOLVER VERSION IS THE PHYSICS.
    # Same-seed determinism and every torque assertion are numeric asserts against one build,
    # so a floor would resolve to the newest release in a fresh env and reappear as a mystery
    # failure. Verified: wheels exist for {ubuntu, windows} x {cp311, cp312, cp313}.
    "mujoco==3.11.0",
]   # TORCH TIER ON BY DEFAULT (user policy, 2026-07-18)

# TORCH TIER = ON BY DEFAULT (user policy, 2026-07-18). torch is now a HARD default dependency: a plain
# `pip install .` pulls torch+numpy and the torch BRAIN TIER runs by default -- hippocampus/ng_snn.py
# (NG-SNN classifier) + cortex/{brain,language_acquisition,neurogenesis_engine}.py (the unified Brain,
# language acquisition, the neurogenesis engine) grow/learn on torch out of the box. Corrected
# 2026-07-28: this listed `cortex/language_center.py` and "its SpikeGPT language center", and that
# module does not exist -- TORCH_TIER in __init__.py names language_acquisition. This
# INTENTIONALLY supersedes the former zero-dep-core contract, and as of 2026-07-29 there is no
# off-switch left: torch is required, not preferred. If it is missing the install is broken, and the
# brain's stdlib fallback exists to make that survivable rather than to make it a mode. numpy is
# likewise imported unguarded at module top level across cortex/, hippocampus/, thalamus/ and
# substrate/. The [gpu]/[train] extras below pin the GPU/training wheels
# (torchvision/snntorch/tonic) on top of the default torch.
[project.optional-dependencies]
arm = ["pyserial"]                                                       # live_arm --serial / --actuate
lake = ["polars", "pyarrow", "deltalake"]                               # lakehouse/medallion + delta_demo
gpu = ["torch", "torchvision", "snntorch==1.0.0", "bindsnet", "numpy", "scikit-learn"]   # research/ GPU training
train = ["torch", "torchvision", "snntorch>=0.9", "numpy", "scikit-learn"]              # GPU trainers (snn-train; training/surrogate_snn.py hybrid N-MNIST perception encoder, +[nmnist] for tonic) -> export weights to the Brain's OPTIONAL torch perception tier; the default install never imports it
# scikit-learn ADDED 2026-08-04 (specs/010, finding C07). It was imported UNGUARDED at module top in
# four `reasoning/` modules -- deep_stdp_2stage_svm.py:80-81, developmental_loop_lake99.py:28-29,
# ensemble_rbf.py:27-28, ng_snn/validate_uci.py:18-19 -- and declared NOWHERE, so `pip install .`
# produced a tree where `import snn_data_lake.reasoning.ensemble_rbf` raised ModuleNotFoundError.
# CI never caught it: ci.yml installs only `-e .` and `-e ".[dev]"`, and the module gate scopes
# `reasoning/` out entirely. Placed in the EXTRAS rather than core deliberately: those four modules
# already sit beside snntorch/torchvision imports, so an extra matches the tier they actually live
# in, and core placement would not have made them importable anyway (they fail earlier on snntorch).
# Per P7 this needs no justification beyond what it buys: SVC/StandardScaler for the SVM readouts.
nmnist = ["tonic"]                                                       # research/nmnist_ingest real data
nengo = ["nengo"]                                                       # substrate/nengo_bridge: run the brain's NEF/LIF substrate on Nengo (sim + NengoLoihi deploy); nengo-gated, the default install never imports it
nir = ["nir", "numpy"]                                                   # substrate/nir_export.to_nir_graph -> canonical NIR HDF5 for Loihi 2 / SpiNNaker 2 / Speck / Xylo. ADDED 2026-08-04 (specs/010, P7): the import at nir_export.py:121 is lazy and raises a helpful ImportError, but it was declared NOWHERE, so `pip install ".[all]"` could not produce a tree where the export path runs. Distribution name confirmed from the module's own install hint ("pip install nir numpy"), not guessed.
arc = ["arcengine"]                                                      # src/snn_data_lake/reasoning/arc_agi/{play,play_brain}.py: the ARC-AGI-3 arcade bridge. ADDED 2026-08-05 (P7 ledger): `from arcengine import GameAction, GameState` is UNGUARDED at module top in BOTH, and both SHIP IN THE WHEEL (`[tool.hatch.build.targets.wheel] packages = ["src/snn_data_lake"]`), so `pip install .` produced a tree where `import snn_data_lake.reasoning.arc_agi.play` raised ModuleNotFoundError -- RE-RUN 2026-08-05 in .venv-lake, it does. DECLARED rather than guarded/retired: under P4c `reasoning/` is part of the brain and not a parking lot, so the honest fix for an unguarded import of a real distribution is to declare it; under P7 "it would be another dependency" is not a reason to reject one. Distribution name read from the INSTALLED metadata (.venv-arc/Lib/site-packages/arcengine-0.9.3.dist-info/METADATA -> `Name: arcengine`, `Author: arcprizefoundation`, INSTALLER `pip`, no direct_url.json so it came from an index, not a local path), NOT from play.py's docstring, which names the SIBLING `arc-agi` distribution (`Name: arc-agi` 0.9.9, `Requires-Dist: arcengine>=0.9.3`) that merely depends on it -- declaring on the docstring's word would have manufactured the false entry this file's ledger warns about.
# THE MARKER IS GONE, 2026-08-05, AND THE COMMENT THAT JUSTIFIED IT WAS REWRITTEN RATHER THAN LEFT
# TO ROT. This spec read `arcengine; python_version >= "3.12"` for as long as requires-python was
# ">=3.11", and the paragraph here explained why: arcengine declares `Requires-Python: >=3.12`, so
# an unmarked spec was unresolvable on 3.11. It then recorded the marker's price in its own words --
# *"There is no install command that makes them importable on 3.11"* -- which was TRUE while the
# floor was 3.11 and is FALSE now that the floor is 3.12. That sentence is deleted, not softened:
# with `requires-python = ">=3.12"` (see the block beside it above) the marker is vacuously true on
# every supported interpreter, so it buys nothing and is removed, and `pip install ".[arc]"` now
# installs arcengine on every interpreter this project supports.
#
# WHAT THAT DOES *NOT* BUY -- THE MODULES ARE NOW IMPORTABLE AND ARE STILL NOT RUNNABLE. Raising the
# floor fixes an INSTALL defect and nothing else. Both modules remain broken on 3.12 with arcengine
# present, for reasons that have nothing to do with the interpreter, each MEASURED in .venv-lake on
# 2026-08-05 rather than read off the source:
#   * `play.py` binds `import snn_data_lake.reasoning.arc_agi as arc_agi` -- the FIRST-PARTY package
#     -- and `play()` then calls `arc_agi.Arcade()`. `reasoning/arc_agi/__init__.py` is a single
#     docstring line and defines no `Arcade`; measured, `hasattr(arc_agi, "Arcade")` is False, so
#     that call raises AttributeError on 3.12 with arcengine installed exactly as it would on 3.11.
#   * `play_brain.py` does bare `from play import _BY_VALUE, play` and `from rule_inducer import
#     ...` after its sys.path bootstrap was gutted to a bare `pass` ("migrated: sys.path bootstrap
#     removed"). There are no top-level `play` / `rule_inducer` distributions: measured,
#     `importlib.util.find_spec("play")` and `find_spec("rule_inducer")` are both None, so it cannot
#     resolve its siblings from an installed wheel at all, on any interpreter.
# Fixing `Arcade` and the sibling imports is out of scope for the floor change and is open work in
# files this commit does not touch. Declaring the dependency closes the P7 ledger's UNDECLARED
# finding -- a finding about pyproject naming its imports -- and that is the whole of what it closes.
llm = ["airllm", "torch"]                                               # local_llm/ on-device NL interface (AirLLM layer-by-layer local inference â€” no cloud)
genn = ["pygenn", "ml_genn"]                                             # research/*_genn + training/mnist_genn GPU trainer (needs a C++ compiler + CUDA)
exe = ["pyinstaller"]                                                   # build a standalone Windows .exe (build-time only)
hf = ["datasets", "huggingface-hub", "pillow"]                            # substrate/hf_stream.py: streamed licensed datasets -> features
desktop = ["pywebview"]                                                 # integrations/desktop/cockpit_desktop.py: the cockpit in a native GPU-composited window
# [viz] RETIRED with the matplotlib/netplotbrain frontends (brain_activity_3d, brain_netplot,
# spiking_chat). The one frontend is substrate/cockpit.py, which draws the anatomical brain, the
# region rates and the arm in browser Canvas 2D from stdlib -- no matplotlib, no netplotbrain, and
# no TemplateFlow download on first render. Nothing in the tree imports those six packages now.
dev = ["pytest>=7.0", "pytest-cov", "ruff==0.15.20", "pre-commit"]       # tests + lint/format (NOT runtime; ruff PINNED, not floored -- see below)
# ruff is PINNED, not floored, as of 2026-07-29. The floor was `>=0.15.20`, matching
# `.pre-commit-config.yaml`'s `rev: v0.15.20`. But a floor resolves to the newest release, so installing
# the dev extra into a second environment picked up ruff 0.16.0 and created a THIRD formatting
# authority disagreeing with both the pre-commit hook and the 422 files currently formatted in-tree --
# a whole-tree reformat diff, arriving as a mysterious `ruff format --check` failure. A formatter's
# version is part of the format. Bump this pin and the pre-commit rev together, deliberately, or not
# at all.
all = ["spiking-neural-data-lake[arm,lake,gpu,nir,nmnist,train]"]        # every addon EXCEPT the ones in tools/dependency_ledger.ALL_EXCLUDES, each of which carries a written reason there (RE-DERIVED 2026-08-05 from tomllib + the tool, not quoted: 8 entries -- dev, exe, genn, llm, desktop, hf, nengo, arc -- against 6 extras reachable from here, and 6+8 leaves the uncovered set EMPTY. Stated unambiguously because the first draft said "14 declared in total" and the obvious re-measurement, `len(project.optional-dependencies)`, prints 15: there are 15 KEYS, of which 14 are extras besides [all] itself, and it is those 14 that split 6/8). The comment this replaces read "every addon (genn excluded -- needs a compiler)": it named ONE of eight exclusions and so read as complete, which is how [nir] sat outside [all] unnoticed. `nir` ADDED to [all] 2026-08-05: its own declaration above justifies its existence by "`pip install \".[all]\"` could not produce a tree where the export path runs" -- and it STILL could not, because nothing ever put it here, so the declaration bought nothing it claimed. Enforced from now on by tools/dependency_ledger.py's ALL-EXTRA check, which fails any extra that is in neither [all] nor ALL_EXCLUDES (and, symmetrically, any ALL_EXCLUDES entry that is in [all] or names no extra at all).

# GPU wheel note (the [gpu]/[train] extras pin bare `torch`, so `pip install` pulls the DEFAULT-index wheel):
# on recent NVIDIA GPUs the default CPU/older-CUDA wheel will NOT run the training/research tier. Install the
# CUDA build that matches your card FIRST, then the extra. For an RTX 5070 (Blackwell, sm_120) use the cu128 wheel:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
#   pip install ".[train]"        # (or ".[gpu]") -- torch is already satisfied by the cu128 build above
# The repo's verified GPU env is `.venv-cu128` (torch 2.11.0+cu128); `NORD_GPU=1` routes tensors to cuda.
# The default install never needs any of this -- it runs on CPU, anywhere (see docs/PERFORMANCE.md).

[project.scripts]
snn-demo = "snn_data_lake.substrate.demo:main"         # one-file demo loop
snn-arm  = "snn_data_lake.brainstem.live_arm:main"     # live gesture -> arm (add --serial/--actuate for hardware)
snn-loop = "snn_data_lake.brainstem.closed_loop:main"  # full closed loop: gesture -> command -> reward -> learn
# snn-ui RETIRED: the tkinter control panel is gone. The ONE frontend is substrate/cockpit.py, served
# by the always-on daemon (`python learn_daemon.py` -> http://127.0.0.1:8137/). It is deliberately NOT
# a console script: the cockpit never constructs a Brain (Policy 4), so a standalone launcher would
# either stand up a second brain against the same durable lake or duplicate the daemon's drive loop.
# One brain, one loop, one frontend.
snn-train = "snn_data_lake.training.cli:main"  # [train] extra: surrogate-gradient GPU trainer -> exports weights to the core
snn-fetch-corpus = "snn_data_lake.substrate.web_ingest:cli"  # firewalled web -> training-corpus fetch (stdlib urllib)
snn-nengo-launch = "snn_data_lake.substrate.nengo_bridge:launch"  # [nengo] extra: run the whole brain LIVE under nengo.Simulator (per-tick trace; NengoLoihi-deployable, observation-only)

[project.urls]
Homepage = "https://github.com/Aighluvsekks/Spiking-Neural-Data-Lake"

[tool.hatch.build.targets.wheel]
packages = ["src/snn_data_lake"]

# ---- dev tooling (all in the `dev` extra; never a runtime dep) ------------------
# pytest: the debuggable/coverable suite beside run_selfchecks.py's smoke gate.
# src on path so `snn_data_lake.*` imports without an install; "." so tests can reuse the
# canonical run_selfchecks.CORE list. cov gate enforces the >=70% acceptance bar.
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
# `-p no:nengo` added 2026-07-29, and it is what makes the CUDA env usable as a gate env at all.
# nengo ships a pytest plugin whose hook signature -- pytest_report_collectionfinish(config, startdir,
# items) -- is invalid under pytest 9.1.1, so plugin AUTOLOAD aborts collection with
# PluginValidationError before a single test runs, in any environment where nengo is installed
# (`.venv-cu128` is). It presents as a total test failure and has nothing to do with this project's
# code. Disabling that one plugin is inert where nengo is absent, so it is safe unconditionally.
# This is the real reason the CPU env had been the only place pytest could start.
addopts = "-q -p no:nengo --cov=snn_data_lake --cov-report=term-missing --cov-fail-under=70"
# test_selfchecks runs each module via runpy after the package is already imported; that emits a
# benign "found in sys.modules" RuntimeWarning. Silence only that one.
filterwarnings = ["ignore:.*found in sys.modules.*:RuntimeWarning"]

[tool.coverage.run]
source = ["snn_data_lake"]
# reasoning/ (folded research builds) + training/ (torch GPU trainers) are verified by their own
# run_selfchecks self-checks, not the unit suite -- omit them from the coverage denominator (they are
# ruff-excluded for the same reason).
omit = ["*/reasoning/*", "*/training/*"]

# ruff: scoped to the core + tests. research/ and the standalone "robot arm/" sketch are
# excluded on purpose (linting them means editing quarantined / optional-dep code â€” out of scope
# here; see docs/IMPROVEMENTS.md A4).
[tool.ruff]
line-length = 100
# py311 -> py312, 2026-08-05, tracking `requires-python` above. This is the pyupgrade (UP) target: a
# stale `py311` here holds UP back from rules that assume 3.12 on a project that no longer supports
# 3.11, which is a check silently left loose rather than a neutral leftover. MEASURED BEFORE BEING
# APPLIED, on this tree in .venv-lake with ruff 0.15.20 -- `ruff check .` exits 0 under BOTH
# `--target-version py311` and `--target-version py312` (zero new findings), and
# `ruff format --check src tests tools` prints "474 files already formatted" under both, so the bump
# reformats nothing and reddens nothing. It TIGHTENS the ruleset; if it ever reddens later that is a
# real UP finding on new code, not this line misbehaving.
target-version = "py312"
extend-exclude = ["research", "integrations", "src/snn_data_lake/training", "training", "scratchpad"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The existing modules are hand-aligned (~100-col lines, deliberate `a; b` compaction, short
# l/I loop vars, a couple of lambdas). Relax those pure-style rules on the existing code rather
# than reflowing it; genuine findings (unused/unsorted imports, dead vars, deprecated aliases,
# yield-from) are still fixed. New code under tests/ is held to the full ruleset.
[tool.ruff.lint.per-file-ignores]
"src/**" = ["E501", "E702", "E731", "E741", "B905"]
# docs/coverage/artifacts/** holds the A/B PROBES that produced the coverage ledger's evidence, sitting
# beside the machine-recorded transcripts they emitted. They are tracked deliberately: a cited
# instrument must survive a clone, and this repo has three recorded incidents of citing one that did not
# (see tools/citation_guard.py). But they are EVIDENCE, not maintained source -- each one was written to
# answer a single band question, ran once, and is kept so the number can be re-derived rather than
# re-imagined. So line length is relaxed here exactly as it is for src/**, while the rules that catch
# REAL defects (F401 unused import, F811 redefinition, F841 dead assignment, B*) stay ON: a probe with
# an unused import may be a probe that measured the wrong thing. Excluding the directory outright would
# have been the easier fix and would have switched those checks off too.
"docs/coverage/artifacts/**" = ["E501"]
# reasoning/ (172 folded research builds) was excluded from ruff ENTIRELY until 2026-07-28, which made
# it the least-governed surface in the tree: not linted, not covered by brain_atlas parity, not in the
# dormancy gate's BRAIN_MODULES, and omitted from the coverage denominator. Four exclusions stacking on
# the directory that 15 live-brain lazy imports point into is how dead code accumulates unseen. It is
# now linted for the rules that catch REAL defects -- F401 unused imports, F811 redefinitions, F841 dead
# vars, B006/B008 mutable and call-valued defaults -- while the purely stylistic rules stay off, because
# reflowing 282 printf-format strings in research code is churn, not governance.
"src/snn_data_lake/reasoning/**" = ["E501", "E702", "E731", "E741", "B905", "UP031", "I001", "E402", "F541", "B007"]
"run_selfchecks.py" = ["E501", "I001"]   # kept byte-for-byte as-is (A1: the smoke gate)
# tools/ is operator tooling written in the src/** style -- long explanatory comments that carry the
# measurement behind a decision. E501 is relaxed there for the same reason it is on src/**; every
# correctness rule (F, B, UP, I) stays ON, which is what caught the two bare zip()s here.
"tools/**" = ["E501"]
