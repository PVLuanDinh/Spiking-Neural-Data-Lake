# Installable src/ package (snn_data_lake). TORCH TIER ON BY DEFAULT (user policy 2026-07-18): the
# default `dependencies` include torch+numpy, so `pip install .` gives the torch brain tier out of the
# box. Set env NORD_TORCH=0 to run torch-free (the non-torch modules are all pure stdlib, so the brain
# still works, just without the torch growth/learning tier). `pip install ".[all]"` adds every addon
# (arm+lake+gpu+nmnist+train); training is a first-class GPU tier (.[train] -> snn-train).
#
# DEPENDENCY SCOPE (user policy 2026-07-19): the former ZERO-DEP-CORE contract is RELAXED -- new
# dependencies MAY be added as the project grows, and the user VERIFIES each one. numpy is a core dep
# (the brain-native language acquisition + growth/learning tiers use it); the interactive-viz stack
# (matplotlib/netplotbrain/pandas/scikit-image/nibabel/templateflow) lives in the [viz] extra. Keep
# every addition justified and surfaced for verification; prefer stdlib when it is genuinely sufficient.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiking-neural-data-lake"
version = "3.28.0"
description = "Neuromorphic gesture -> robot-arm control loop + spiking data lakehouse. Torch tier on by default (NORD_TORCH=0 for a zero-dep stdlib brain)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aighluvsekks" }]
keywords = ["spiking-neural-network", "neuromorphic", "robotics", "data-lakehouse", "stdp"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch", "numpy"]   # TORCH TIER ON BY DEFAULT (user policy, 2026-07-18)

# TORCH TIER = ON BY DEFAULT (user policy, 2026-07-18). torch is now a HARD default dependency: a plain
# `pip install .` pulls torch+numpy and the torch BRAIN TIER runs by default -- hippocampus/ng_snn.py
# (NG-SNN classifier) + cortex/{brain,language_center,neurogenesis_engine}.py (the unified Brain, its
# SpikeGPT language center, the neurogenesis engine) grow/learn on torch out of the box. This
# INTENTIONALLY supersedes the former zero-dep-core contract. MANUAL OFF-SWITCH: set env `NORD_TORCH=0`
# to run torch-free -- the torch tier then degrades to the deterministic stdlib narrator (no growth) and
# run_selfchecks.py skips the torch-gated modules, so the pure-stdlib path still exists on demand. Every
# non-torch module remains pure stdlib, so `NORD_TORCH=0` gives a fully-working zero-dep brain. The
# [gpu]/[train] extras below pin the GPU/training wheels (torchvision/snntorch/tonic) on top of the
# default torch.
[project.optional-dependencies]
arm = ["pyserial"]                                                       # live_arm --serial / --actuate
lake = ["polars", "pyarrow", "deltalake"]                               # lakehouse/medallion + delta_demo
gpu = ["torch", "torchvision", "snntorch==1.0.0", "bindsnet", "numpy"]   # research/ GPU training
train = ["torch", "torchvision", "snntorch>=0.9", "numpy"]              # GPU trainers (snn-train; training/surrogate_snn.py hybrid N-MNIST perception encoder, +[nmnist] for tonic) -> export weights to the Brain's OPTIONAL torch perception tier; zero-dep core never imports it
nmnist = ["tonic"]                                                       # research/nmnist_ingest real data
nengo = ["nengo"]                                                       # substrate/nengo_bridge: run the brain's NEF/LIF substrate on Nengo (sim + NengoLoihi deploy); nengo-gated, zero-dep core never imports it
llm = ["airllm", "torch"]                                               # local_llm/ on-device NL interface (AirLLM layer-by-layer local inference — no cloud)
genn = ["pygenn", "ml_genn"]                                             # research/*_genn + training/mnist_genn GPU trainer (needs a C++ compiler + CUDA)
exe = ["pyinstaller"]                                                   # build a standalone Windows .exe (build-time only)
# [viz] RETIRED with the matplotlib/netplotbrain frontends (brain_activity_3d, brain_netplot,
# spiking_chat). The one frontend is substrate/cockpit.py, which draws the anatomical brain, the
# region rates and the arm in browser Canvas 2D from stdlib -- no matplotlib, no netplotbrain, and
# no TemplateFlow download on first render. Nothing in the tree imports those six packages now.
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.15.20", "pre-commit"]       # tests + lint/format (NOT runtime; ruff floor matches .pre-commit-config)
all = ["spiking-neural-data-lake[arm,lake,gpu,nmnist,train]"]             # every addon (genn excluded — needs a compiler)

# GPU wheel note (the [gpu]/[train] extras pin bare `torch`, so `pip install` pulls the DEFAULT-index wheel):
# on recent NVIDIA GPUs the default CPU/older-CUDA wheel will NOT run the training/research tier. Install the
# CUDA build that matches your card FIRST, then the extra. For an RTX 5070 (Blackwell, sm_120) use the cu128 wheel:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
#   pip install ".[train]"        # (or ".[gpu]") -- torch is already satisfied by the cu128 build above
# The repo's verified GPU env is `.venv-cu128` (torch 2.11.0+cu128); `NORD_GPU=1` routes tensors to cuda.
# The zero-dep CORE never needs any of this -- it runs on pure stdlib, CPU, anywhere (see docs/PERFORMANCE.md).

[project.scripts]
snn-demo = "snn_data_lake.substrate.demo:main"         # one-file demo loop
snn-arm  = "snn_data_lake.brainstem.live_arm:main"     # live gesture -> arm (add --serial/--actuate for hardware)
snn-loop = "snn_data_lake.brainstem.closed_loop:main"  # full closed loop: gesture -> command -> reward -> learn
# snn-ui RETIRED: the tkinter control panel is gone. The ONE frontend is substrate/cockpit.py, served
# by the always-on daemon (`python learn_daemon.py` -> http://127.0.0.1:8137/). It is deliberately NOT
# a console script: the cockpit never constructs a Brain (Policy 4), so a standalone launcher would
# either stand up a second brain against the same durable lake or duplicate the daemon's drive loop.
# One brain, one loop, one frontend.
snn-train = "snn_data_lake.training.cli:main"  # [train] extra: surrogate-gradient GPU trainer -> exports weights to the zero-dep core
snn-fetch-corpus = "snn_data_lake.substrate.web_ingest:cli"  # firewalled web -> training-corpus fetch (zero-dep urllib)
snn-nengo-launch = "snn_data_lake.substrate.nengo_bridge:launch"  # [nengo] extra: run the whole brain LIVE under nengo.Simulator (per-tick trace; NengoLoihi-deployable, observation-only)

[project.urls]
Homepage = "https://github.com/Aighluvsekks/Spiking-Neural-Data-Lake"

[tool.hatch.build.targets.wheel]
packages = ["src/snn_data_lake"]

# ---- dev tooling (all in the `dev` extra; core stays zero-dep) ------------------
# pytest: the debuggable/coverable suite beside run_selfchecks.py's zero-dep smoke gate.
# src on path so `snn_data_lake.*` imports without an install; "." so tests can reuse the
# canonical run_selfchecks.CORE list. cov gate enforces the >=70% acceptance bar.
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --cov=snn_data_lake --cov-report=term-missing --cov-fail-under=70"
# test_selfchecks runs each module via runpy after the package is already imported; that emits a
# benign "found in sys.modules" RuntimeWarning. Silence only that one.
filterwarnings = ["ignore:.*found in sys.modules.*:RuntimeWarning"]

[tool.coverage.run]
source = ["snn_data_lake"]
# reasoning/ (folded research builds) + training/ (torch GPU trainers) are verified by their own
# run_selfchecks self-checks, not the unit suite -- omit them from the coverage denominator (they are
# ruff-excluded for the same reason).
omit = ["*/reasoning/*", "*/training/*"]

# ruff: scoped to the zero-dep core + tests. research/ and the standalone "robot arm/" sketch are
# excluded on purpose (linting them means editing quarantined / optional-dep code — out of scope
# here; see docs/IMPROVEMENTS.md A4).
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research", "integrations", "src/snn_data_lake/training", "training", "src/snn_data_lake/reasoning", "scratchpad"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The existing modules are hand-aligned (~100-col lines, deliberate `a; b` compaction, short
# l/I loop vars, a couple of lambdas). Relax those pure-style rules on the existing code rather
# than reflowing it; genuine findings (unused/unsorted imports, dead vars, deprecated aliases,
# yield-from) are still fixed. New code under tests/ is held to the full ruleset.
[tool.ruff.lint.per-file-ignores]
"src/**" = ["E501", "E702", "E731", "E741", "B905"]
"run_selfchecks.py" = ["E501", "I001"]   # kept byte-for-byte as-is (A1: the zero-dep smoke gate)
