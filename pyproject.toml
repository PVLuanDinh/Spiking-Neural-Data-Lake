# Installable src/ package (snn_data_lake). torch + numpy + mujoco + pyarrow + Brian2 + psutil +
# threadpoolctl + scipy + networkx are UNCONDITIONAL core dependencies, so
# `pip install .` gives the full brain tier out of the box. `pip install ".[all]"` adds every addon
# (arm+lake+gpu+nmnist+train); training is a first-class GPU tier (.[train] -> snn-train).
#
# The NORD_TORCH=0 off-switch is GONE as of 2026-07-29 -- removed from the brain, the atlas, the
# self-check runner, the pytest bootstrap, the two module self-checks that set it, and the frozen-exe
# entry point. It was the last mechanism implementing the zero-dependency rule that this file had
# already declared removed on 2026-07-20, nine days earlier, and a flag that outlives its rule reads
# as a supported configuration. Nothing degraded by deleting it: torch genuinely ABSENT still lands on
# the stdlib tier, because both call sites reach that tier by CATCHING the failed import rather than
# by consulting the flag. The flag's only unique power was disabling the tier while torch was present,
# which is the simulation being retired, not a capability.
#
# DEPENDENCY SCOPE (user policy 2026-07-20): the zero-dependency rule is REMOVED entirely,
# project-wide -- there is no zero-dep-core contract and no pure-stdlib purity gate. New
# dependencies MAY be added as the project grows, and the user VERIFIES each one. numpy is a core dep
# (the brain-native language acquisition + growth/learning tiers use it); the interactive-viz stack
# (matplotlib/netplotbrain/pandas/scikit-image/nibabel/templateflow) lives in the [viz] extra. Keep
# every addition justified and surfaced for verification.
#
# SUPERSEDED BY P7 (owner policy 2026-08-04, docs/POLICIES.md): any dependency or framework that helps
# this become a phenomenal brain is ACCEPTED, including any that helps the brain become sentient.
# This comment's closing clause used to read "prefer stdlib when it is genuinely sufficient"; P7
# retires it by name, because it is the residual brake that was still producing hand-rolled code
# twelve days after the rule above was abolished (three hand-written linear solvers, a hand-written
# PNG encoder while pillow sits declared-and-unimported below, a from-scratch Potjans-Diesmann column
# importing only math and random). "It would be another dependency" is NOT a reason to reject
# anything: a rejection must cite a measurement on the real workload or a structural argument about
# this architecture. Adoption still ships with the measurement of what it bought, and a dependency
# may never become a second durable store (P4b) nor carry its own BPTT trainer into a learning path.
#
# HISTORICAL: snntorch was promoted to core on 2026-08-06 and was replaced by Brian2 on
# 2026-09-22. The measurements below explain the retired decision; they no longer describe the
# installed framework.
# It was declared TWICE in the extras (`[gpu]` pinned `snntorch==1.0.0`, `[train]` floored
# `snntorch>=0.9`) while four GOVERNED modules import it UNGUARDED at module top --
# training/{trainer,offload,mnist,spiking_lm}.py -- and `snn-train` is a declared console script.
# So `pip install .` shipped a tree whose own console-script trainer raised ModuleNotFoundError.
# That is the identical defect this file already fixed for arcengine, and it takes the identical
# fix: DECLARE the distribution the code actually imports. Both extra declarations are RETIRED in
# the same edit rather than left beside the core one -- two version specs for one distribution is
# the additive shape P2 forbids, and it left no single authority on the version.
#
# COST, measured in `.venv-lake` (3.14.6 free-threading, Py_GIL_DISABLED=1, ABI cp314t). The wheel
# is `snntorch-1.0.0-py2.py3-none-any.whl`: 133 KB, and its `requires_dist` is EMPTY -- ZERO
# transitive dependencies. So "does a cp314t wheel exist" is structurally moot rather than lucky:
# a `py2.py3-none-any` wheel has no ABI at all, and `Requires-Python: >=3.9` admits 3.14. Verified
# by INSTALLING it into the gate env and importing it, not by reading an index page. Install 2.6 s
# from a local wheel. MARGINAL COLD IMPORT COST on top of torch -- 11 fresh subprocesses per case,
# medians: torch 1584 ms, torch+snntorch 1570 ms. The delta is -14 ms: below run-to-run noise, and
# under 1% of torch's own 1544 ms. RE-MEASURED INDEPENDENTLY 2026-08-06 by an adversarial pass,
# because a NEGATIVE cost cannot be real and a reader should not have to infer that from the word
# "noise": 15 INTERLEAVED samples per case (interleaved so drift hits both arms equally) give
# medians torch 1421.8 ms, torch+snntorch 1422.6 ms -- delta +0.8 ms, against a torch-only
# run-to-run spread of 43.5 ms, i.e. +0.06%. Both passes agree on the conclusion and only the
# second has a physically possible sign. The same timer resolves torch's own +1391 ms over an
# empty interpreter, so the null is a real null and not a blind instrument.
# It needs no GPU and no CUDA of its own, which is the constraint
# that actually binds here, because CI has no card (ci.yml exercises the layer on CPU).
#
# BENEFIT, AND IT IS SEVEN TIMES SMALLER THAN THE BACKLOG CLAIMED. The proposal that produced this
# change asserted that one declaration would unblock 28 unimportable `reasoning/` modules, all
# tracing to "ONE unguarded module-top import". RE-DERIVED by importing all 152 `reasoning/`
# modules in ISOLATED subprocesses before and after installing it: the census moves 39 failures ->
# 35. FOUR modules are unblocked -- snn_dreamer_6dof, snn_motor_control, snn_ssm_shd,
# snn_world_model_rl -- plus TWO in the governed tier, training/trainer and training/offload (both retired 2026-10-02).
# SIX in total. The first draft of this comment said "training/{trainer,offload,spiking_lm}" and
# that was an OVERCLAIM caught by running the before-state instead of inferring it: spiking_lm (retired 2026-10-02)
# guarded its own import and was ALREADY importable, so crediting it here would have counted a
# module this change did not move. training/mnist (retired 2026-10-02) stayed red on torchvision.
# The premise was wrong twice over: SEVEN `reasoning/` modules import snntorch directly at module
# top (not one), and the hub file has a SECOND unguarded absent import on the very next line. The
# other 18 do not become importable; they RE-LABEL from snntorch to `torchvision`.
#
# torchvision is therefore REJECTED for core, and on a STRUCTURAL argument rather than on
# dependency count, which P7 forbids as a reason. Measured: `pip install torchvision` on cp314t
# resolves torchvision-0.28.0, which pins `torch==2.13.0` and would REPLACE this gate env's
# torch 2.11.0+cu128 with the default-index CPU build -- silently removing the GPU from the one
# environment P5 names. It stays in [gpu]/[train], where installing it is a deliberate act.
#
# NOT RELAXED BY THAT ADOPTION -- the e-prop invariant. snntorch's LAYERS were adopted, never its
# BPTT trainer. Recorded because it cuts against this very change: all four modules unblocked here
# carry `surrogate` + `loss.backward()`, so importability is NOT promotability. Each still owes
# cosine > 0.5 against an independent gradient before it can be anything but EXEMPT.
#
# BRIAN2 REPLACES SNNTORCH 2026-09-22. Brian2 is the canonical equation/event simulator;
# growth/brian2_backend.py keeps the existing Torch autograd paths through a small differentiable
# bridge and proves that bridge against a real Brian2 NeuronGroup. Brian2 2.10.1 is exact-pinned:
# it publishes a cp314t Windows wheel and its numerical/code-generation behavior is part of the
# simulator contract. Its CPython 3.14t extension currently enables the GIL on import, so the real
# Brian2 reference runs in an isolated subprocess and the parent brain remains free-threaded. Torch
# remains core because it is still the tensor/autograd engine.
[build-system]
# maturin ADDED 2026-10-18 (f2-pkg, Codex B2 MAJOR 1): the wheel hook below builds snn_data_lake._native
# (native/sndl-python, a HARD runtime dependency of the PFC) inside the isolated build env, so every
# install path produces an importable extension. The Rust toolchain is a host requirement (docs/INSTALL.md).
requires = ["hatchling", "maturin>=1.15,<2"]
build-backend = "hatchling.build"

[project]
name = "spiking-neural-data-lake"
version = "4.80.0"
description = "Neuromorphic gesture -> robot-arm control loop + spiking data lakehouse. torch, numpy, pyarrow, mujoco, Brian2, psutil, threadpoolctl, scipy, and networkx are core dependencies."
readme = "README.md"
# FLOOR RAISED 3.12 -> 3.14, 2026-08-05 (owner decision), and this floor is NOT the whole
# requirement. The project requires the FREE-THREADED (PEP 703) build, and `requires-python` cannot
# express that: free-threading is a BUILD of an interpreter, not a language level. `>=3.14` is the
# half the packaging metadata can carry; the other half is a RUNTIME guard in
# `src/snn_data_lake/__init__.py` that refuses to import under a GIL-enabled interpreter, because a
# silent fallback to the GIL build is precisely the failure this project would not notice -- every
# self-check would pass, single-threaded, and the parallelism would simply not be there.
# The ABI tag for the required build is cp314t. Verified available on win_amd64 for all three core
# dependencies before this floor moved: torch-2.13.0-cp314-cp314t-win_amd64.whl,
# mujoco-3.11.0-cp314-cp314t-win_amd64.whl, numpy-2.5.1-cp314-cp314t-win_amd64.whl. The mujoco one
# was the gating question, since that pin is exact BECAUSE the solver version is the physics.
requires-python = ">=3.14"
# FLOOR RAISED 3.11 -> 3.12, 2026-08-05 (owner decision), for the [arc] extra's arcengine; that extra and its two
# importers (reasoning/arc_agi) were RETIRED by del-reasoning 1b, so the floor now stands on the cp314t ABI above.
#
# THE PRICE, WRITTEN DOWN RATHER THAN PAPERED OVER: THE CPU GATE VENV NO LONGER CONFORMS TO THIS
# FLOOR. `.venv-lake` is **Python 3.11.15** -- measured 2026-08-05, twice: `.venv-lake/pyvenv.cfg`
# reads `version = 3.11.15`, and `.venv-lake/Scripts/python.exe --version` prints `Python 3.11.15`.
# That venv is the deterministic CPU gate env named throughout docs/POLICIES.md P5 and
# docs/RUNNING.md, and EVERY MEASUREMENT RECORDED IN THIS REPO WAS TAKEN IN IT.
#
# The consequence is MEASURED, not predicted -- pip enforces this field and refuses the install.
# Constructed and RUN 2026-08-05 in `.venv-lake` (pip 24.0) against two hand-built wheels differing
# in nothing but this one metadata line:
#     Requires-Python: >=3.11  ->  "Would install reqpy-floor311-0.0.1"                     exit 0
#     Requires-Python: >=3.12  ->  "ERROR: Package 'reqpy-floor312' requires a different
#                                   Python: 3.11.15 not in '>=3.12'"                        exit 1
# (Both lines RE-RUN independently 2026-08-05 by a second pass, from wheels rebuilt from scratch, and
# the control/red pair reproduces exactly. One transcription error was found and fixed doing it: this
# block quoted `"Would install reqpy_floor311-0.0.1"` with an UNDERSCORE. pip prints the DISTRIBUTION
# name, which is hyphenated -- `reqpy-floor311-0.0.1`; the underscore is the wheel FILENAME's
# normalization. A quoted-verbatim line has to be pasted from the run, not reconstructed from the
# artifact's filename, or it is a paraphrase wearing quotation marks.)
# So `pip install -e .` and `pip install -e ".[dev]"` into `.venv-lake` FAIL from this commit
# forward. The venv is deliberately NOT recreated here -- that is the orchestrator's call, and
# recreating it invalidates the measurement baseline of every number in docs/. Until it is
# recreated on 3.12, the gate env and the declared floor DISAGREE, and that disagreement is a known
# open item recorded here rather than an oversight discovered later.
license = "MIT"
authors = [{ name = "Aighluvsekks" }]
keywords = ["spiking-neural-network", "neuromorphic", "robotics", "data-lakehouse", "stdp"]
# Classifiers track the CI matrix, which is {3.12, 3.13} as of this commit (.github/workflows/ci.yml,
# job `self-checks`). This list read "Python :: 3.11" alone while the matrix tested three versions.
classifiers = [
    # 3.12 and 3.13 REMOVED 2026-08-05 with the >=3.14 floor: `requires-python` already excludes
    # them, so leaving the classifiers would have advertised support the metadata refuses to install.
    # The gate env `.venv-lake` IS 3.14.6 free-threading, so this is not aspirational -- it names the
    # interpreter every number in docs/ is now measured on.
    "Programming Language :: Python :: 3.14",
    # There is NO classifier for the free-threaded build, which is why the real requirement lives in
    # `src/snn_data_lake/__init__.py::_require_free_threaded` and in ci.yml's explicit
    # Py_GIL_DISABLED assertion. Recorded here so a reader of this list does not conclude that a
    # GIL-enabled 3.14 is supported: it installs, and then refuses to import.
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "numpy",
    # PROMOTED from the [lake] extra 2026-08-19 (specs/022 T005): pyarrow is the sealed-segment
    # container of the ONE durable lake (substrate/lake_segments.py -- Arrow IPC files, footer-
    # indexed). The lake engine is core, so its container is core (P7). Until this promotion the
    # declaration sat in an extra with ZERO importers -- the exact declared-but-never-imported
    # shape P7's honesty guard names; the import now exists and is governed. Verified installing
    # and running with the GIL disabled on cp314t (25.0.1).
    "pyarrow",
    # THE BODY. Owner directive 2026-08-01: the MuJoCo SO-101 replaces the 2-DOF kinematic
    # ArmSim as the arm, so the physics engine is core rather than an extra.
    # EXACT PIN, not a floor, on this file's own recorded precedent for ruff ("a formatter's
    # version is part of the format"): for a physics engine the SOLVER VERSION IS THE PHYSICS.
    # Same-seed determinism and every torque assertion are numeric asserts against one build,
    # so a floor would resolve to the newest release in a fresh env and reappear as a mystery
    # failure. Verified: wheels exist for {ubuntu, windows} x {cp311, cp312, cp313}.
    "mujoco==3.11.0",
    # THE SPIKING SIMULATOR. Brian2 is the equation/event authority; an isolated reference process
    # verifies the free-threaded Torch bridge in growth/brian2_backend.py. Exact-pinned because
    # simulator and code-generation behavior are part of the numerical contract, just as MuJoCo's
    # solver version is the physics.
    "brian2==2.10.1",
    # THE REFERENCE CHILD'S MEMORY PROBE. growth/brian2_backend.py reads the isolated Brian2
    # child's peak working set through psutil for the registered backend self-check's cost report
    # (T101 panel G1, 2026-09-22: it was installed only as pygenn's transitive dependency, so the
    # ledger reddened). Unpinned: a measurement library, not part of the numerical contract.
    "psutil",
    # THE THREAD-POLICY INSTRUMENT. reservoir/recurrent_pool.py pins BLAS to one thread for its cost
    # timing and drives its R-b3 determinism check at 1 and 24 BLAS threads; instruments/memory_diagnostic.py
    # runs every replay's readout at one BLAS thread and records the loaded backend
    # (evidence/g1b-pool-selection.md sections 2.2 and 2.7; the ESN-LSM eigvals it was first declared
    # for left with g2, section 3.5). Installed only as scikit-learn's transitive dependency until
    # 2026-09-25, so the ledger reddened. Unpinned: a measurement library, not part of the numerical contract.
    "threadpoolctl",
    # THE LP SOLVER. growth/capacity_certificate.py::farkas_witness (G3's multiclass infeasibility
    # certificate) and instruments/delayed_cue.py::float_separability_lp (G2's float separability
    # read) import scipy.optimize.linprog directly (in-function imports). Installed only as
    # scikit-learn's transitive dependency until 2026-10-07, so the ledger reddened at the batch-1
    # battery. Unpinned: a solver whose answer is checked exactly downstream (the certificate's
    # exact check; the LP is a measurement), not part of the numerical contract.
    "scipy",
    # THE GRAPH REFERENCE. instruments/unit_organization.py imports networkx in TWO functions for
    # IR1/IR3's reference arms, both on purpose and neither replaceable by stdlib or scipy: ::random_graph
    # is nx.gnm_random_graph(N, M, seed) -- the RANDOM arm that RULE must beat, needing a seeded
    # simple graph with EXACTLY M edges and the same edge distribution the comparison assumes, which
    # scipy.sparse.csgraph has no generator for; ::best_partition is nx.community.louvain_communities
    # plus nx.community.modularity -- the Louvain partition the NMI >= 0.9 bar is frozen against, and
    # rewriting Louvain would redefine the bar rather than meet it. Both are IN-FUNCTION imports, so
    # the core self-check stays networkx-free. Installed only as torch's transitive dependency until
    # 2026-10-10, so the ledger reddened at the batch-3 battery (G7). Unpinned: a reference library
    # whose partitions and graphs are checked by the comparison, not part of the numerical contract.
    "networkx",
]   # TORCH TIER ON BY DEFAULT (user policy, 2026-07-18)

