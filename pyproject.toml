snn-arm  = "snn_data_lake.sensorimotor.live_arm:main"     # live gesture -> arm (add --serial/--actuate for hardware)
snn-loop = "snn_data_lake.sensorimotor.closed_loop:main"  # full closed loop: gesture -> command -> reward -> learn
# snn-ui RETIRED: the tkinter control panel is gone. The ONE frontend is infra/cockpit.py, served
# by the always-on daemon (`python learn_daemon.py` -> http://127.0.0.1:8137/). It is deliberately NOT
# a console script: the cockpit never constructs a Brain (Policy 4), so a standalone launcher would
# either stand up a second brain against the same durable lake or duplicate the daemon's drive loop.
# One brain, one loop, one frontend.
snn-fetch-corpus = "snn_data_lake.sensorimotor.web_ingest:cli"  # firewalled web -> training-corpus fetch (stdlib urllib)
snn-nengo-launch = "snn_data_lake.infra.nengo_bridge:launch"  # [nengo] extra: run the whole brain LIVE under nengo.Simulator (per-tick trace; NengoLoihi-deployable, observation-only)

[project.urls]
Homepage = "https://github.com/Aighluvsekks/Spiking-Neural-Data-Lake"

[tool.hatch.build.targets.wheel]
packages = ["src/snn_data_lake"]
artifacts = ["src/snn_data_lake/_native.*"]   # gitignored (.gitignore: in-tree built binding) -- shipped anyway

# The hook IS infra.native_build (one build path, P2): `get_build_hook` runs its `main` on every build
# (a present extension may be stale) and tags the wheel for the interpreter (never py3-none-any). No root
# hatch_build.py: that would be an ungoverned build under P4c (p4c_ratchet's `<repo root>` zone).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "src/snn_data_lake/infra/native_build.py"

[tool.hatch.metadata]
# The [genn] extra is a PEP 508 direct reference (pygenn is not on PyPI -- see the extra's
# comment). Hatchling refuses direct references without this switch; the package is not
# published to an index, so the direct-reference restriction protects nothing here.
allow-direct-references = true

# ---- dev tooling (all in the `dev` extra; never a runtime dep) ------------------
# pytest: the debuggable/coverable suite beside run_selfchecks.py's smoke gate.
# src on path so `snn_data_lake.*` imports without an install; "." so tests can reuse the
# canonical run_selfchecks.CORE list. cov gate enforces the >=70% acceptance bar.
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
# `-p no:nengo` added 2026-07-29, and it is what makes the CUDA env usable as a gate env at all.
# nengo ships a pytest plugin whose hook signature -- pytest_report_collectionfinish(config, startdir,
# items) -- is invalid under pytest 9.1.1, so plugin AUTOLOAD aborts collection with
# PluginValidationError before a single test runs, in any environment where nengo is installed
# (`.venv-cu128` is). It presents as a total test failure and has nothing to do with this project's
# code. Disabling that one plugin is inert where nengo is absent, so it is safe unconditionally.
# This is the real reason the CPU env had been the only place pytest could start.
addopts = "-q -p no:nengo --cov=snn_data_lake --cov-report=term-missing --cov-fail-under=70"
# test_selfchecks runs each module via runpy after the package is already imported; that emits a
# benign "found in sys.modules" RuntimeWarning. Silence only that one.
filterwarnings = ["ignore:.*found in sys.modules.*:RuntimeWarning"]
# `slow`: a test that spawns real interpreters and drives hundreds of ticks. It is NOT deselected by
# default -- registering the marker only stops PytestUnknownMarkWarning, which is a real hazard here:
# an unregistered marker is a silent typo, and a typo'd `pytest.mark.slwo` would mark nothing while
# reading exactly like it did. Deselect locally with `-m "not slow"`.
markers = [
    "slow: spawns subprocesses and drives many ticks (minutes, not seconds)",
    "timing: asserts wall-clock REPEATABILITY -- the battery runs these serially, after the parallel pass",
]

[tool.coverage.run]
source = ["snn_data_lake"]
# reasoning/ (folded research builds) + training/ (torch GPU trainers) are verified by their own
# run_selfchecks self-checks, not the unit suite -- omit them from the coverage denominator (they are
# ruff-excluded for the same reason).
omit = ["*/reasoning/*", "*/training/*"]
# Self-check coverage (owner 2026-10-19, option A): the battery runs `coverage run run_selfchecks.py
# --battery` (CORE + TORCH_GATED in one interpreter, the other tiers as subprocesses) into its own data
# file, pytest into another; the two are combined and the 70% bar is checked ONCE on the combined
# report. CI runs the in-process self-checks, then pytest --cov-append, bar on the last run.
# pytest no longer re-runs the self-checks in-process.

# ruff: scoped to the core + tests. research/ and the standalone "robot arm/" sketch are
# excluded on purpose (linting them means editing quarantined / optional-dep code â€” out of scope
# here; see docs/IMPROVEMENTS.md A4).
[tool.ruff]
line-length = 100
# py311 -> py312, 2026-08-05, tracking `requires-python` above. This is the pyupgrade (UP) target: a
# stale `py311` here holds UP back from rules that assume 3.12 on a project that no longer supports
# 3.11, which is a check silently left loose rather than a neutral leftover. MEASURED BEFORE BEING
# APPLIED, on this tree in .venv-lake with ruff 0.15.20 -- `ruff check .` exits 0 under BOTH
# `--target-version py311` and `--target-version py312` (zero new findings), and
# `ruff format --check src tests tools` prints "474 files already formatted" under both, so the bump
# reformats nothing and reddens nothing. It TIGHTENS the ruleset; if it ever reddens later that is a
# real UP finding on new code, not this line misbehaving.
target-version = "py312"
extend-exclude = ["research", "integrations", "src/snn_data_lake/training", "training", "scratchpad"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The existing modules are hand-aligned (~100-col lines, deliberate `a; b` compaction, short
# l/I loop vars, a couple of lambdas). Relax those pure-style rules on the existing code rather
# than reflowing it; genuine findings (unused/unsorted imports, dead vars, deprecated aliases,
# yield-from) are still fixed. New code under tests/ is held to the full ruleset.
[tool.ruff.lint.per-file-ignores]
"src/**" = ["E501", "E702", "E731", "E741", "B905"]
# docs/coverage/artifacts/** holds the A/B PROBES that produced the coverage ledger's evidence, sitting
# beside the machine-recorded transcripts they emitted. They are tracked deliberately: a cited
# instrument must survive a clone, and this repo has three recorded incidents of citing one that did not
# (see tools/citation_guard.py). But they are EVIDENCE, not maintained source -- each one was written to
# answer a single band question, ran once, and is kept so the number can be re-derived rather than
# re-imagined. So line length is relaxed here exactly as it is for src/**, while the rules that catch
# REAL defects (F401 unused import, F811 redefinition, F841 dead assignment, B*) stay ON: a probe with
# an unused import may be a probe that measured the wrong thing. Excluding the directory outright would
# have been the easier fix and would have switched those checks off too.
"docs/coverage/artifacts/**" = ["E501", "I001"]  # I001 added at G8-2: frozen probes import moved modules by their legacy names, which ruff re-sections once the old file is gone; the artifacts are never re-sorted
# reasoning/ (172 folded research builds) was excluded from ruff ENTIRELY until 2026-07-28, which made
# it the least-governed surface in the tree: not linted, not covered by brain_atlas parity, not in the
# dormancy gate's BRAIN_MODULES, and omitted from the coverage denominator. Four exclusions stacking on
# the directory that 15 live-brain lazy imports point into is how dead code accumulates unseen. It is
# now linted for the rules that catch REAL defects -- F401 unused imports, F811 redefinitions, F841 dead
# vars, B006/B008 mutable and call-valued defaults -- while the purely stylistic rules stay off, because
# reflowing 282 printf-format strings in research code is churn, not governance.
"src/snn_data_lake/reasoning/**" = ["E501", "E702", "E731", "E741", "B905", "UP031", "I001", "E402", "F541", "B007"]
"run_selfchecks.py" = ["E501", "I001"]   # kept byte-for-byte as-is (A1: the smoke gate)
# tools/ is operator tooling written in the src/** style -- long explanatory comments that carry the
# measurement behind a decision. E501 is relaxed there for the same reason it is on src/**; every
# correctness rule (F, B, UP, I) stays ON, which is what caught the two bare zip()s here.
"tools/**" = ["E501"]
