# Installable src/ package (snn_data_lake). Core is pure-stdlib (empty `dependencies`); optional
# extras below add integrations. `pip install .` makes every module importable as
# `snn_data_lake.<mod>` + installs the console commands below; `pip install ".[all]"` adds every
# addon (arm+lake+gpu+nmnist+train). Core is zero-dep for clone-and-run inference; training is a
# first-class opt-in GPU tier (.[train] -> snn-train, src/snn_data_lake/training/, exports to core).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiking-neural-data-lake"
version = "2.75.1"
description = "Neuromorphic gesture -> robot-arm control loop + spiking data lakehouse. Zero-dep core, clone-and-run."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aighluvsekks" }]
keywords = ["spiking-neural-network", "neuromorphic", "robotics", "data-lakehouse", "stdp"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []   # the core is pure standard library — that is the point

[project.optional-dependencies]
arm = ["pyserial"]                                                       # live_arm --serial / --actuate
lake = ["polars", "pyarrow", "deltalake"]                               # lakehouse/medallion + delta_demo
gpu = ["torch", "torchvision", "snntorch==1.0.0", "bindsnet", "numpy"]   # research/ GPU training
train = ["torch", "torchvision", "snntorch>=0.9", "numpy"]              # src/snn_data_lake/training/: first-class GPU trainer (snn-train); exports weights back to the zero-dep core
nmnist = ["tonic"]                                                       # research/nmnist_ingest real data
llm = ["airllm", "torch"]                                               # local_llm/ on-device NL interface (AirLLM layer-by-layer local inference — no cloud)
genn = ["pygenn"]                                                        # research/*_genn GPU port (needs a C++ compiler + CUDA)
exe = ["pyinstaller"]                                                   # build a standalone Windows .exe of the tkinter GUI (build-time only; core stays zero-dep)
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.15.20", "pre-commit"]       # tests + lint/format (NOT runtime; ruff floor matches .pre-commit-config)
all = ["spiking-neural-data-lake[arm,lake,gpu,nmnist,train]"]             # every addon (genn excluded — needs a compiler)

[project.scripts]
snn-demo = "snn_data_lake.demo:main"         # one-file demo loop
snn-arm  = "snn_data_lake.live_arm:main"     # live gesture -> arm (add --serial/--actuate for hardware)
snn-loop = "snn_data_lake.closed_loop:main"  # full closed loop: gesture -> command -> reward -> learn
snn-ui   = "snn_data_lake.control_panel:main"  # zero-dep tkinter desktop control panel (arm + recognition + lake)
snn-train = "snn_data_lake.training.cli:main"  # [train] extra: surrogate-gradient GPU trainer -> exports weights to the zero-dep core

[project.urls]
Homepage = "https://github.com/Aighluvsekks/Spiking-Neural-Data-Lake"

[tool.hatch.build.targets.wheel]
packages = ["src/snn_data_lake"]

# ---- dev tooling (all in the `dev` extra; core stays zero-dep) ------------------
# pytest: the debuggable/coverable suite beside run_selfchecks.py's zero-dep smoke gate.
# src on path so `snn_data_lake.*` imports without an install; "." so tests can reuse the
# canonical run_selfchecks.CORE list. cov gate enforces the >=70% acceptance bar.
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --cov=snn_data_lake --cov-report=term-missing --cov-fail-under=70"
# test_selfchecks runs each module via runpy after the package is already imported; that emits a
# benign "found in sys.modules" RuntimeWarning. Silence only that one.
filterwarnings = ["ignore:.*found in sys.modules.*:RuntimeWarning"]

[tool.coverage.run]
source = ["snn_data_lake"]

# ruff: scoped to the zero-dep core + tests. research/, gcp/, infra/ and the standalone
# "robot arm/" sketch are excluded on purpose (linting them means editing quarantined /
# optional-dep code — out of scope here; see docs/IMPROVEMENTS.md A4).
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research", "gcp", "infra", "robot arm", "local_llm", "packaging", "src/snn_data_lake/training"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The existing modules are hand-aligned (~100-col lines, deliberate `a; b` compaction, short
# l/I loop vars, a couple of lambdas). Relax those pure-style rules on the existing code rather
# than reflowing it; genuine findings (unused/unsorted imports, dead vars, deprecated aliases,
# yield-from) are still fixed. New code under tests/ is held to the full ruleset.
[tool.ruff.lint.per-file-ignores]
"src/**" = ["E501", "E702", "E731", "E741", "B905"]
"run_selfchecks.py" = ["E501", "I001"]   # kept byte-for-byte as-is (A1: the zero-dep smoke gate)
