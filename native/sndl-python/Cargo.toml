[package]
name = "sndl-python"
version = "0.1.0"
edition = "2024"
publish = false
description = "The one PyO3 binding over sndl-core: wrappers only, no logic (plan section 9). Module snn_data_lake._native."

[lib]
name = "sndl_python"
crate-type = ["cdylib"]

[dependencies]
sndl-core = { path = "../sndl-core" }
# =0.30.1 is the pyo3 Phase 0 gated (gil_used = false default, free-threaded 3.14t); pin, do not float.
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
